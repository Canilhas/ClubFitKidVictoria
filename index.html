    return items.map(([id, talla, cantidad]) => { const p = prod(id); return { id, nombre: p.nombre, talla, cantidad, precio: p.precio }; });
  }
  function sembrar() {
    const nombres = ['Lucía Ferrer', 'Martina Gil', 'Paula Navarro', 'Carla Ibáñez', 'Noa Martínez', 'Abril Soler', 'Vega Romero'];
    const tels = ['612 345 678', '633 210 457', '655 908 112', '677 431 290', '690 772 045', '622 456 789', '644 118 503'];
    const notas = ['', 'Repasar el ejercicio de suelo', '', 'Primera clase particular', '', 'Preparar la Copa Base', ''];
    const tipos = ['Bono', 'Suelta', 'Bono', 'Suelta', 'Suelta', 'Bono', 'Suelta'];
    const reservas = [];
    for (let i = 1, k = 0; i <= 26 && reservas.length < 7; i++) {
      const f = sumaDias(hoy(), i);
      if (diaSemana(f) === 0 || EJEMPLO.ajustes.diasSinClases.includes(f)) continue;
      if (i % 3 !== 1 && i % 7 !== 5) continue;
      const h = horasDelDia(f)[i % 3];
      reservas.push({ id: 'R-' + pad4(reservas.length + 1), creada: marca(new Date(Date.now() - (30 - i) * 36e5)), fecha: f, hora: h, nombre: nombres[k], telefono: tels[k], email: '', comentario: notas[k], estado: 'Confirmada', tipo: tipos[k] });
      k++;
    }
    if (reservas[4]) reservas[4].estado = 'Cancelada';
    const p1 = lineas([['chaqueta', '134-140', 1], ['pantalon', '134-140', 1]]);
    const p2 = lineas([['camiseta-hombre', 'S', 2], ['sudadera', 'M', 1]]);
    const tot = ls => ls.reduce((s, l) => s + l.precio * l.cantidad, 0);
    const pedidos = [
      { id: 'P-0001', creado: marca(new Date(Date.now() - 3 * 864e5)), nombre: 'Lucía Ferrer', telefono: '612 345 678', email: '', observaciones: '', estado: 'Pagado', lineas: p1, total: tot(p1) },
      { id: 'P-0002', creado: marca(new Date(Date.now() - 864e5)), nombre: 'Abril Soler', telefono: '622 456 789', email: '', observaciones: 'Si se puede, nombre bordado en la sudadera: ABRIL', estado: 'Pendiente', lineas: p2, total: tot(p2) },
    ];
    return { v: 3, reservas, pedidos };
  }
  function cargar() {
    if (db) return db;
    const g = store.get(KEY, null);
    db = g && g.v === 3 && Array.isArray(g.reservas) ? g : sembrar();
    guardar();
    return db;
  }
  function guardar() { store.set(KEY, db); }
  function validar(d) {
    if (!d || String(d.nombre || '').trim().length < 2) return 'Escribe el nombre del deportista.';
    if (soloDigitos(d.telefono).length < 9) return 'Escribe un teléfono válido.';
    if (!d.consentimiento) return 'Falta aceptar la protección de datos.';
    return '';
  }
  async function init() {
    return espera({ ok: true, data: { hoy: hoy(), ajustes: ajustes(), inicio: EJEMPLO.inicio, historia: EJEMPLO.historia, temporada: EJEMPLO.temporada, entrenamientos: EJEMPLO.entrenamientos, calendario: EJEMPLO.calendario, productos: EJEMPLO.productos } }, 80);
  }
  async function slots(mes) {
    const base = cargar();
    const a = ajustes(), h = hoy(), lim = claveAhora(120);
    const oc = {};
    base.reservas.forEach(r => { if (r.estado !== 'Cancelada') oc[r.fecha + '|' + r.hora] = 1; });
    const [y, m] = mes.split('-').map(Number);
    const n = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const dias = [];
    for (let d = 1; d <= n; d++) {
      const f = `${mes}-${pad(d)}`;
      if (f < h || f < (a.reservasDesde || '') || diaSemana(f) === 0) continue;
      if (a.diasSinClases.includes(f)) { dias.push({ fecha: f, cerrado: true, horas: [] }); continue; }
      dias.push({ fecha: f, cerrado: false, horas: horasDelDia(f).map(x => ({ hora: x, estado: oc[f + '|' + x] ? 'ocupado' : (`${f} ${x}` <= lim ? 'pasado' : 'libre') })) });
    }
    return espera({ ok: true, data: { mes, dias } });
  }
  async function reservar(d) {
    const base = cargar();
    const err = validar(d);
    if (err) return espera({ ok: false, error: err });
    const dia = (await slots(String(d.fecha).slice(0, 7))).data.dias.find(x => x.fecha === d.fecha);
    const h = dia && dia.horas.find(x => x.hora === d.hora);
    if (!h || h.estado !== 'libre') return espera({ ok: false, code: 'ocupado', error: 'Ese horario se acaba de ocupar. Elige otro.' });
    const r = { id: 'R-' + pad4(base.reservas.length + 1), creada: marca(), fecha: d.fecha, hora: d.hora, nombre: d.nombre.trim(), telefono: d.telefono.trim(), email: (d.email || '').trim(), comentario: (d.comentario || '').trim(), estado: 'Confirmada', tipo: d.tipo === 'Bono' ? 'Bono' : 'Suelta' };
    base.reservas.push(r);
    guardar();
    return espera({ ok: true, data: { id: r.id, fecha: r.fecha, hora: r.hora, avisado: true, confirmacion: !!r.email, aviso: textoReserva(r) } }, 420);
  }
  async function pedido(d) {
    const base = cargar();
    const err = validar(d);
    if (err) return espera({ ok: false, error: err });
    const ls = [];
    for (const it of (d.items || [])) {
      const p = prod(it.id);
      if (!p || !p.tallas.includes(it.talla)) return espera({ ok: false, error: 'Uno de los productos ya no está disponible. Revisa el pedido.' });
      if (!(p.precio > 0)) return espera({ ok: false, error: `${p.nombre}: el club todavía no ha puesto el precio. Quítala del pedido.` });
      ls.push({ id: p.id, nombre: p.nombre, talla: it.talla, cantidad: Math.max(1, Math.min(10, it.cantidad | 0)), precio: p.precio });
    }
    if (!ls.length) return espera({ ok: false, error: 'El pedido está vacío.' });
    const total = ls.reduce((s, l) => s + l.precio * l.cantidad, 0);
    const p = { id: 'P-' + pad4(base.pedidos.length + 1), creado: marca(), nombre: d.nombre.trim(), telefono: d.telefono.trim(), email: (d.email || '').trim(), observaciones: (d.observaciones || '').trim(), estado: 'Pendiente', lineas: ls, total };
    base.pedidos.push(p);
    guardar();
    return espera({ ok: true, data: { id: p.id, total, lineas: ls, avisado: true, confirmacion: !!p.email, aviso: textoPedido(p) } }, 420);
  }
  async function admin(op, x) {
    const base = cargar();
    if (x.password !== PASS) return espera({ ok: false, code: 'auth', error: 'Contraseña incorrecta.' }, 400);
    if (op === 'login') return espera({ ok: true, data: {} });
    if (op === 'listar') return espera({ ok: true, data: { reservas: base.reservas, pedidos: base.pedidos, hojaUrl: '' } });
    if (op === 'cancelarReserva') {
      const r = base.reservas.find(z => z.id === x.id);
      if (!r) return espera({ ok: false, error: 'No encuentro esa reserva.' });
      r.estado = 'Cancelada'; guardar();
      return espera({ ok: true, data: { id: r.id, estado: r.estado } });
    }
    if (op === 'estadoPedido') {
      const p = base.pedidos.find(z => z.id === x.id);
      if (!p) return espera({ ok: false, error: 'No encuentro ese pedido.' });
      p.estado = x.estado; guardar();
      return espera({ ok: true, data: { id: p.id, estado: p.estado } });
    }
    if (op === 'probarAvisos') return espera({ ok: true, data: { resultados: [['WhatsApp Administrador 1'], ['WhatsApp Administrador 2'], ['Email del club']].map(([canal]) => ({ canal, ok: true, detalle: 'Simulado: en la demo no se envía nada.' })) } }, 500);
    if (op === 'reiniciar') { db = sembrar(); guardar(); return espera({ ok: true, data: {} }); }
    return espera({ ok: false, error: 'Operación desconocida.' });
  }
  async function inscribir(d) {
    if (!d || String(d.nino || '').trim().length < 2 || !d.firma) return espera({ ok: false, error: 'Faltan datos de la ficha.' });
    const n = (store.get('club-demo-fichas', 0) || 0) + 1;
    store.set('club-demo-fichas', n);
    return espera({ ok: true, data: { id: 'I-' + pad4(n), avisado: true, confirmacion: true } }, 600);
  }
  return { init, slots, reservar, pedido, inscribir, admin };
})();

    try {
      const r = await fetch(url, Object.assign({ redirect: 'follow', signal: ctl ? ctl.signal : undefined }, opts));

    } catch (e) {
      return { ok: false, error: 'No se ha podido conectar con el club. Revisa tu conexión e inténtalo de nuevo.' };

  },

/* grupos recreativos de la pestaña Horarios («3-4 años», «5-7 años»…) */
function gruposRecreativos() {
  const g = [];
  ((S.init && S.init.entrenamientos) || []).filter(x => /recrea/i.test(x.tipo || '')).forEach(x => String(x.grupo || '').split(/\s*,\s*|\s+y\s+/).forEach(n => { n = n.trim(); if (n && !g.includes(n)) g.push(n); }));
  const desde = n => Number((n.match(/\d+/) || [99])[0]);
  return g.sort((a, b) => desde(a) - desde(b));
}
function edadDe(nac, hoy = hoyRef()) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(nac || '') || nac >= hoy) return null;
  const a = nac.split('-').map(Number), b = hoy.split('-').map(Number);
  return b[0] - a[0] - (b[1] < a[1] || (b[1] === a[1] && b[2] < a[2]) ? 1 : 0);
}
function grupoPorEdad(edad) {
  if (edad == null) return '';
  return gruposRecreativos().find(g => { const m = g.match(/(\d+)\s*[-–a]\s*(\d+)/); return m && edad >= +m[1] && edad <= +m[2]; }) || '';
}

/* firma: un lienzo donde se dibuja con el dedo, el lápiz o el ratón */
const Firma = { trazos: 0, lienzo: null };
function montarFicha(borrador) {
  const cv = $('#i-firma');
  if (!cv) return;
  const caja = $('#i-firma-caja');
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const ancho = caja.clientWidth || 320, alto = 170;
  cv.width = Math.round(ancho * dpr); cv.height = Math.round(alto * dpr);
  cv.style.height = alto + 'px';
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14110A'; ctx.lineWidth = 2.4;
  Firma.trazos = 0; Firma.lienzo = cv;
  let dib = false, ult = null;
  const pos = ev => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
  cv.addEventListener('pointerdown', ev => { ev.preventDefault(); dib = true; ult = pos(ev); try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* nada */ } ctx.beginPath(); ctx.arc(ult.x, ult.y, 1.1, 0, Math.PI * 2); ctx.fillStyle = '#14110A'; ctx.fill(); });
  cv.addEventListener('pointermove', ev => {
    if (!dib) return;
    const p = pos(ev);
    ctx.beginPath(); ctx.moveTo(ult.x, ult.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ult = p;
  });
  const fin = () => { if (!dib) return; dib = false; Firma.trazos++; caja.classList.add('firmada'); $('.firma-borrar', caja).hidden = false; };
  cv.addEventListener('pointerup', fin); cv.addEventListener('pointercancel', fin); cv.addEventListener('pointerleave', fin);
  // si la vista se volvió a pintar mientras se rellenaba, se recupera lo escrito
  if (borrador) {
    const f = $('#f-ins');
    Object.entries(borrador.campos).forEach(([k, val]) => {
      const n = f.elements[k]; if (!n) return;
      if (n instanceof RadioNodeList || (n.length && !n.tagName)) [...n].forEach(r => { r.checked = r.value === val; });
      else if (n.type === 'checkbox') n.checked = val === true;
      else n.value = val;
    });
    if (borrador.firma) { const img = new Image(); img.onload = () => { ctx.drawImage(img, 0, 0, ancho, alto); }; img.src = borrador.firma; Firma.trazos = 1; caja.classList.add('firmada'); $('.firma-borrar', caja).hidden = false; }
    actualizarEdad();
  }
}

function leerFicha(form) {
  const el = form.elements;
  const v = n => (el[n] ? String(el[n].value || '').trim() : '');
  const radio = n => { const r = form.querySelector(`input[name="${n}"]:checked`); return r ? r.value : ''; };
  const d = {
    nino: v('nino'), nacimiento: v('nacimiento'), primeraVisita: v('primeraVisita'), grupo: el.grupo && el.grupo.tagName === 'INPUT' && el.grupo.type !== 'radio' ? v('grupo') : radio('grupo'),
    deportePrevio: radio('deportePrevio'), deporteCual: v('deporteCual'),
    tutor: v('tutor'), relacion: radio('relacion'), telefono: v('telefono'), email: v('email'),
    fisica: radio('fisica'), fisicaCual: v('fisicaCual'), alergia: radio('alergia'), alergiaCual: v('alergiaCual'), otra: v('otra'),
    emergNombre: v('emergNombre'), emergTel: v('emergTel'),
    participar: el.participar.checked, confirmo: el.confirmo.checked, imagenes: radio('imagenes'), consentimiento: el.consentimiento.checked,
    firmante: v('firmante') || v('tutor'), web: v('web'),
  };
  if (d.grupo === 'No lo sé') d.grupo = '';
  const err = (error, campo) => ({ error, campo });
  if (d.nino.length < 2) return err('Escribe el nombre y apellidos del niño o la niña.', 'nino');
  const edad = edadDe(d.nacimiento);
  if (edad == null || edad > 18) return err('Revisa la fecha de nacimiento.', 'nacimiento');
  if (d.primeraVisita && d.primeraVisita < hoyRef()) return err('El día de la primera visita no puede ser anterior a hoy.', 'primeraVisita');
  if (!d.deportePrevio) return err('Indica si ha practicado algún deporte antes.', 'deportePrevio');
  if (d.deportePrevio === 'Sí' && d.deporteCual.length < 2) return err('Indica qué deporte ha practicado.', 'deporteCual');
  if (d.tutor.length < 2) return err('Escribe el nombre y apellidos del padre, la madre o el tutor.', 'tutor');
  if (!d.relacion) return err('Indica la relación con el menor: padre, madre o tutor/a.', 'relacion');
  const dg = soloDigitos(d.telefono);
  if (dg.length < 9 || dg.length > 15) return err('Escribe un teléfono válido: 9 cifras, o con prefijo si no es de España.', 'telefono');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) return err('Escribe un email válido: ahí os llegará la copia de la ficha.', 'email');
  if (!d.fisica) return err('Indica si hay alguna circunstancia física que debamos conocer.', 'fisica');
  if (d.fisica === 'Sí' && d.fisicaCual.length < 2) return err('Cuéntanos qué circunstancia física debemos conocer.', 'fisicaCual');
  if (!d.alergia) return err('Indica si tiene alguna alergia o intolerancia.', 'alergia');
  if (d.alergia === 'Sí' && d.alergiaCual.length < 2) return err('Indica la alergia o intolerancia.', 'alergiaCual');
  if (d.emergTel && soloDigitos(d.emergTel).length < 9) return err('Revisa el teléfono de emergencia.', 'emergTel');
  if (!d.participar) return err('Falta marcar la autorización para participar en los entrenamientos.', 'participar');
  if (!d.confirmo) return err('Falta confirmar que la información es correcta.', 'confirmo');
  if (!d.imagenes) return err('Indica si autorizas o no el uso de fotografías y vídeos.', 'imagenes');
  if (d.firmante.length < 2) return err('Escribe el nombre de quien firma.', 'firmante');
  if (!Firma.trazos) return err('Falta la firma: fírmala con el dedo o el ratón en el recuadro.', 'firma');
  if (!d.consentimiento) return err('Marca la casilla de protección de datos para enviar la ficha.', 'consentimiento');
  d.firma = firmaRecortada();
  return d;
}
/* la firma, recortada a lo dibujado y sobre fondo blanco (así pesa poco y se ve bien en el email y el PDF) */
function firmaRecortada() {
  const cv = Firma.lienzo, w = cv.width, h = cv.height;
  const px = cv.getContext('2d').getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) if (px[(y * w + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 <= x0 || y1 <= y0) { x0 = 0; y0 = 0; x1 = w - 1; y1 = h - 1; }
  const m = 16, sx = Math.max(0, x0 - m), sy = Math.max(0, y0 - m), sw = Math.min(w, x1 + m) - sx, sh = Math.min(h, y1 + m) - sy;
  const k = Math.min(1, 600 / sw);
  const out = document.createElement('canvas');
  out.width = Math.round(sw * k); out.height = Math.round(sh * k);
  const c = out.getContext('2d');
  c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, out.width, out.height);
  c.drawImage(cv, sx, sy, sw, sh, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}
async function enviarFicha(form) {
  const d = leerFicha(form);
  const errBox = $('#i-err');
  form.querySelectorAll('[aria-invalid]').forEach(n => n.removeAttribute('aria-invalid'));
  if (d.error) {
    errBox.textContent = d.error; errBox.hidden = false;
    const n = d.campo === 'firma' ? $('#i-firma-caja') : form.elements[d.campo];
    const nodo = n && (n.tagName ? n : n[0]);
    if (nodo) { if (nodo.setAttribute) nodo.setAttribute('aria-invalid', 'true'); try { nodo.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { /* nada */ } if (nodo.focus) nodo.focus({ preventScroll: true }); }
    return;
  }
  errBox.hidden = true;
  const btn = form.querySelector('[type="submit"]');
  btn.disabled = true; const txt = btn.innerHTML; btn.innerHTML = '<span>Enviando la ficha…</span>';
  const res = await API.inscribir(d);
  if (!res.ok) { btn.disabled = false; btn.innerHTML = txt; errBox.textContent = res.error || 'No se ha podido enviar la ficha. Inténtalo de nuevo.'; errBox.hidden = false; return; }
  if (form.elements.recordar.checked) store.set('club-contacto-ficha', { tutor: d.tutor, relacion: d.relacion, telefono: d.telefono, email: d.email, emergNombre: d.emergNombre, emergTel: d.emergTel });
  else store.del('club-contacto-ficha');
  S.fichaBorrador = null;
  S.ficha = { id: res.data.id, nino: d.nino, email: d.email, primeraVisita: d.primeraVisita, confirmacion: !!res.data.confirmacion };
  renderView();
  window.scrollTo(0, 0);
  const t = $('#ficha-ok'); if (t) t.focus();
}

function cuerpoSlots() {
  const st = S.slots[S.mes];
  if (!st) { cargarSlots(S.mes); return filasCarga(5); }
  if (st.estado === 'cargando') return filasCarga(5);
  if (st.estado === 'error') return errorBox(st.error, 'reintentar-slots');
  const dias = st.data.dias || [];
  if (!dias.length) return `<div class="empty"><p>No quedan días con clases en ${mesLabel(S.mes).toLowerCase()}. Prueba con el mes siguiente.</p></div>`;
  const semanas = [];
  dias.forEach(d => {
    const lunes = sumaDias(d.fecha, -((diaSemana(d.fecha) + 6) % 7));
    let w = semanas[semanas.length - 1];
    if (!w || w.lunes !== lunes) { w = { lunes, dias: [] }; semanas.push(w); }
    w.dias.push(d);
  });
  return semanas.map(w => {
    const a = parseYmd(w.dias[0].fecha), b = parseYmd(w.dias[w.dias.length - 1].fecha);
    const label = a.d === b.d ? `${cap(fechaLarga(w.dias[0].fecha))}` : `Del ${a.d} al ${b.d} de ${MESES[a.m - 1]}`;
    return `<div class="week"><h2 class="week-label">${label}</h2>${w.dias.map(filaDia).join('')}</div>`;
  }).join('');
}
function filaDia(d) {
  const { d: num } = parseYmd(d.fecha);
  const hoy = d.fecha === hoyRef();
  const izq = `<div class="dleft"><span class="dnum">${pad(num)}</span><span class="dname">${DIAS[diaSemana(d.fecha)]}${hoy ? ' <span class="today">hoy</span>' : ''}</span></div>`;
  if (d.cerrado) return `<div class="day closed">${izq}<p class="closed-txt">Sin clases este día</p></div>`;
  const pills = d.horas.map(h => {
    const lbl = `${cap(fechaLarga(d.fecha))}, ${h.hora}`;
    if (h.estado === 'libre') return `<button class="slot" type="button" data-act="slot" data-fecha="${d.fecha}" data-hora="${h.hora}" aria-label="Reservar ${lbl}">${h.hora}</button>`;
    if (h.estado === 'ocupado') return `<button class="slot taken" type="button" disabled aria-label="${lbl}, ocupada">${h.hora}</button>`;
    return `<button class="slot past" type="button" disabled aria-label="${lbl}, ya no se puede reservar">${h.hora}</button>`;
  }).join('');
  const libres = d.horas.filter(h => h.estado === 'libre').length;
  return `<div class="day${libres ? '' : ' full'}">${izq}<div class="slots">${pills}${libres ? '' : '<span class="full-txt">Completo</span>'}</div></div>`;
}

/* =================================================================
   HORARIOS DE ENTRENAMIENTO
   ================================================================= */
const DIAS_CORTOS = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
const GRUPOS_HOR = [['recreativo', 'Recreativo'], ['base', 'Base'], ['promesas', 'Promesas'], ['nacional', 'Nacional']];
const textoSesion = x => `${x.tipo || ''} ${x.grupo || ''}`.toLowerCase();
const tipoSesion = x => { const k = textoSesion(x); return k.includes('baile') ? 'baile' : k.includes('recreativ') ? 'recreativo' : 'competicion'; };
/* A qué grupos afecta cada entrenamiento, para el filtro («equipo completo» = todos los de competición) */
function gruposSesion(x) {
  const k = textoSesion(x);
  if (k.includes('recreativ')) return ['recreativo'];
  if (k.includes('completo') || /\btod[oa]s\b/.test(k)) return ['base', 'promesas', 'nacional'];
  return [['base', 'base'], ['promesas', 'promes'], ['nacional', 'nacion']].filter(([, raiz]) => k.includes(raiz)).map(([g]) => g);
}
const minutosDe = h => { const [a, b] = String(h).split(':').map(Number); return a * 60 + (b || 0); };
function duracionTxt(ini, fin) {
  const m = minutosDe(fin) - minutosDe(ini);
  if (!(m > 0)) return '';
  const h = Math.floor(m / 60), r = m % 60;
  return h ? `${h} h${r ? ` ${r} min` : ''}` : `${r} min`;
}
function vHorarios() {
  const falta = necesitaInit('Horarios');
  if (falta) return falta;
  const todas = S.init.entrenamientos || [];
  const cab = cabecera('Horarios', 'Entrenamientos de cada grupo esta temporada. Elige el tuyo para ver solo sus horas.');
  if (!todas.length) return `<div class="view">${cab}<div class="empty"><p>El club todavía no ha publicado los horarios de entrenamiento.</p></div></div>`;
  const presentes = GRUPOS_HOR.filter(([k]) => todas.some(x => gruposSesion(x).includes(k)));
  if (S.horGrupo && !presentes.some(([k]) => k === S.horGrupo)) S.horGrupo = null;
  const ses = S.horGrupo ? todas.filter(x => gruposSesion(x).includes(S.horGrupo)) : todas;
  const hoy = diaSemana(hoyRef());
  const orden = [1, 2, 3, 4, 5, 6, 0];
  const dias = orden.map(d => ({ d, lista: ses.filter(x => x.dia === d) })).filter(x => x.lista.length);
  const conEntreno = new Set(dias.map(x => x.d));
  const filtro = presentes.length > 1 ? `<div class="cat-bar"><div class="hor-wrap"><div class="hor-chips" role="group" aria-label="Grupo">
      <button class="hor-chip" type="button" data-act="hor-grupo" data-g="" aria-pressed="${!S.horGrupo}">Todos</button>
      ${presentes.map(([k, n]) => `<button class="hor-chip" type="button" data-act="hor-grupo" data-g="${k}" aria-pressed="${S.horGrupo === k}">${n}</button>`).join('')}
    </div></div></div>` : '';
  const semana = `<ol class="semana" aria-label="Días de entrenamiento">${orden.map(d => {
    const on = conEntreno.has(d);
    return `<li><button class="sem-dia${on ? ' on' : ''}${d === hoy ? ' es-hoy' : ''}" type="button"${on ? ` data-act="ir-dia" data-d="${d}"` : ' disabled'} aria-label="${cap(DIAS[d])}${d === hoy ? ' (hoy)' : ''}${on ? '' : ', sin entrenamiento'}">${DIAS_CORTOS[d]}</button></li>`;
  }).join('')}</ol>`;
  const icono = t => (t === 'baile' ? ICON.music : t === 'recreativo' ? ICON.star : ICON.trophy);
  const tarjetas = dias.map(({ d, lista }) => {
    const esHoy = d === hoy;
    const fin = lista.reduce((m, x) => (x.fin > m ? x.fin : m), lista[0].fin);
    return `<section class="dia-card${esHoy ? ' hoy' : ''}" id="dia-${d}" aria-labelledby="dia-t-${d}">
      <header class="dia-head"><h2 class="dia-nombre" id="dia-t-${d}">${cap(DIAS[d])}</h2>${esHoy ? '<span class="dia-hoy">Hoy</span>' : ''}<span class="dia-rango">${esc(lista[0].inicio)} – ${esc(fin)}</span></header>
      <ol class="sesiones">${lista.map(x => {
        const t = tipoSesion(x);
        const nombres = String(x.grupo || '').split(/\s*[,·]\s*/).filter(Boolean);
        const quien = nombres.length > 1 ? `<ul class="ses-grupos">${nombres.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : (x.grupo ? `<p class="ses-grupo">${esc(x.grupo)}</p>` : '');
        return `<li class="sesion t-${t}">
          <p class="ses-hora"><b>${esc(x.inicio)}</b><span class="sr-only"> a </span><span>${esc(x.fin)}</span></p>
          <div class="ses-info">${x.tipo ? `<p class="ses-tipo">${esc(x.tipo)}</p>` : ''}${quien}<p class="ses-dur">${duracionTxt(x.inicio, x.fin)}</p></div>
          <span class="ses-ico" aria-hidden="true">${icono(t)}</span>
        </li>`;
      }).join('')}</ol>
    </section>`;
  }).join('');
  return `<div class="view">${cab}${filtro}${semana}<div class="dias">${tarjetas}</div></div>`;
}

/* Iconos según el título de cada fila (Cuota → billete, Licencia → carnet…) */
const ICONO_DATO = [[/cuota|mensual|precio|pago|matr[ií]cula/i, 'billete'], [/licencia|federa|seguro|ficha/i, 'carnet'], [/inicio|empieza|comienzo/i, 'cal'], [/\bfin\b|final|termina/i, 'flag'], [/inscrip/i, 'user'], [/horari|entren/i, 'clock'], [/competici|campeonato/i, 'trophy'], [/grupo|equipo|deportista/i, 'users']];
const ICONO_INFO = [[/horari|entren/i, 'clock'], [/clase|reserva/i, 'cal'], [/ropa|pedido|equipaci/i, 'shirt'], [/pago|cuota|bizum|precio/i, 'billete'], [/competici|campeonato/i, 'trophy'], [/federa|licencia|febd/i, 'star'], [/whatsapp|aviso|comunica|contacto|duda/i, 'chat'], [/material|bolsa|mochila/i, 'bag'], [/foto|imagen|redes|instagram/i, 'camera'], [/d[oó]nde|pabell[oó]n|direcci/i, 'pin'], [/inscrip|alta/i, 'user'], [/grupo|equipo|categor/i, 'users'], [/m[uú]sica|baile/i, 'music']];
// filas de «Informaciones adicionales» que llevan a una sección de la app
const RUTA_INFO = [[/horari|entrenamiento/i, 'horarios'], [/clase|reserva/i, 'reservas'], [/ropa|pedido|equipaci/i, 'ropa'], [/competici|campeonato|calendario/i, 'calendario']];
// busca primero en el título y, si no, en el texto
const iconoDe = (txts, tabla, def) => { for (const t of [].concat(txts)) { const f = tabla.find(([re]) => re.test(t)); if (f) return ICON[f[1]]; } return ICON[def]; };
const sinTildes = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

/* Fecha escrita en la hoja («8 de septiembre de 2026», «08/09/2026», «2026-09-08») → 'aaaa-mm-dd' ('' si no se entiende) */
function fechaDeTexto(txt) {
  const t = sinTildes(txt);
  let y = 0, m = 0, d = 0, r;
  if ((r = t.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))) { y = +r[1]; m = +r[2]; d = +r[3]; }
  else if ((r = t.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/))) { d = +r[1]; m = +r[2]; y = +r[3]; }
  else if ((r = t.match(/(\d{1,2})\s*(?:de\s+)?([a-z]{3,})\.?\s*(?:de\s+|del\s+)?(\d{4})/))) {
    const k = r[2].slice(0, 3);
    d = +r[1]; y = +r[3]; m = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'].indexOf(k === 'set' ? 'sep' : k) + 1;
  }
  if (!y || !m || !d) return '';
  const f = new Date(Date.UTC(y, m - 1, d));
  return f.getUTCMonth() === m - 1 && f.getUTCDate() === d ? `${y}-${pad(m)}-${pad(d)}` : '';
}
/* Inicio y fin de la temporada, de las filas Dato («Inicio de entrenamientos», «Fin de temporada») */
function cursoDe(datos) {
  const ini = datos.find(x => /inicio|empieza|comienzo/i.test(x.titulo) && fechaDeTexto(x.texto));
  const fin = datos.find(x => /\bfin\b|final|termina/i.test(x.titulo) && fechaDeTexto(x.texto));
  if (!ini || !fin) return null;
  const a = fechaDeTexto(ini.texto), b = fechaDeTexto(fin.texto);
  return b > a ? { ini, fin, a, b } : null;
}
/* Tarjeta de oro: del inicio al fin de la temporada, con una barra que marca por dónde vamos */
function tarjetaCurso(c) {
  const hoy = hoyRef();
  const total = diasEntre(c.a, c.b);
  const hechos = diasEntre(c.a, hoy);
  const pct = Math.max(0, Math.min(100, Math.round(hechos / total * 1000) / 10));
  const A = parseYmd(c.a), B = parseYmd(c.b);
  const mes3 = m => MESES[m - 1].slice(0, 3);
  let estado, clase, nota;
  if (hoy < c.a) { const n = diasEntre(hoy, c.a); estado = 'Próximamente'; clase = 'antes'; nota = n === 1 ? 'Empieza <b>mañana</b>' : `Empieza en <b>${n} días</b>`; }
  else if (hoy > c.b) { estado = 'Terminada'; clase = 'fuera'; nota = 'La temporada ha terminado. ¡Gracias por este año!'; }
  else {
    const quedan = diasEntre(hoy, c.b);
    estado = 'En curso'; clase = 'en-curso';
    nota = `<b>Semana ${Math.floor(hechos / 7) + 1}</b> de ${Math.ceil((total + 1) / 7)} · ${quedan === 0 ? 'último día' : quedan === 1 ? 'queda 1 día' : `quedan ${quedan} días`}`;
  }
  return `<section class="curso" aria-label="Calendario de la temporada">
    <svg class="curso-marca" viewBox="0 0 1000 516" aria-hidden="true"><use href="#logo-alas"/></svg>
    <p class="curso-estado ${clase}">${estado}</p>
    <div class="curso-fechas">
      <p><span>${ICON.cal}Inicio temporada</span><b>${A.d} ${mes3(A.m)}</b><small>${A.y}</small></p>
      <p class="fin"><span>Fin temporada${ICON.flag}</span><b>${B.d} ${mes3(B.m)}</b><small>${B.y}</small></p>
    </div>
    <div class="curso-barra" role="progressbar" aria-label="Avance de la temporada" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width: ${pct}%"></i><span style="left: ${pct}%"></span></div>
    <p class="curso-nota">${nota}</p>
  </section>`;
}
/* Equipación de competición: las prendas de esa categoría del catálogo, con su foto y precio */
function tarjetaEquipacion(x) {
  const cats = [...new Set(productos().flatMap(catsDe))];
  const cat = cats.find(c => sinTildes(x.titulo).includes(sinTildes(c))) || cats[0] || '';
  const prendas = productos().filter(p => !cat || !catsDe(p).length || catsDe(p).includes(cat));
  const marca = CONFIG.MARCA_ROPA || '';
  const conM = marca && sinTildes(x.titulo).endsWith(' ' + sinTildes(marca));
  const titulo = conM ? conMarca(x.titulo.slice(0, -marca.length).trim()) : esc(x.titulo);
  return `<section class="equip" aria-labelledby="equip-t">

    <button class="equip-btn" type="button" data-act="ver-equipacion" data-cat="${esc(cat)}">${ICON.bag}<span>Ver la equipación</span>${ICON.arrow}</button>

}

/* Licencias federativas: una fila por licencia («Fit Kid competitiva nacional» · «FEBD · 40 €»).
   Se agrupan por modalidad (competitiva / recreativa) y la fila sin precio sale como nota al pie. */
function licenciasDe(items) {
  const grupos = [], notas = [];
  items.forEach(x => {
    const t = `${x.titulo} ${x.texto}`;
    const precio = (x.texto.match(/(\d+(?:[.,]\d{1,2})?)\s*€/) || [])[1];
    if (!precio) { notas.push(x); return; }
    const mod = /competi/i.test(t) ? 'Competitiva' : /recrea/i.test(t) ? 'Recreativa' : 'Licencias';
    const fed = (x.texto.match(/\b[A-ZÁÉÍÓÚÑ]{3,}\b/) || [])[0] || '';
    let ambito = x.titulo.replace(/fit\s*kid/i, '').replace(/competitiv[ao]s?|recreativ[ao]s?/i, '').replace(/\s+/g, ' ').trim();
    ambito = ambito ? ambito.charAt(0).toUpperCase() + ambito.slice(1) : x.titulo;
    let g = grupos.find(y => y.mod === mod);
    if (!g) { g = { mod, filas: [] }; grupos.push(g); }
    g.filas.push({ ambito, fed, precio: precio.replace('.', ',') });
  });
  return { grupos, notas };
}
function tarjetaLicencias(items) {
  const { grupos, notas } = licenciasDe(items);
  if (!grupos.length && !notas.length) return '';
  const ico = m => m === 'Competitiva' ? ICON.trophy : m === 'Recreativa' ? ICON.star : ICON.carnet;
  return `<section class="lic" aria-labelledby="lic-t">
    <div class="lic-head"><span class="lic-ico">${ICON.carnet}</span><div><p class="lic-kicker">Coste anual por deportista</p><h2 class="h2" id="lic-t">Licencias federativas</h2></div></div>
    ${grupos.length ? `<div class="lic-grupos">${grupos.map((g, i) => `<div class="lic-grupo${i % 2 ? '' : ' oro'}">
      <p class="lic-mod"><span>${ico(g.mod)}</span>${esc(g.mod)}</p>
      <ul>${g.filas.map(f => `<li><span class="lic-amb"><b>${esc(f.ambito)}</b>${f.fed ? `<small>${esc(f.fed)}</small>` : ''}</span><span class="lic-precio">${esc(f.precio)}<i>€</i></span></li>`).join('')}</ul>
    </div>`).join('')}</div>` : ''}
    ${notas.map(n => `<p class="lic-nota">${ICON.info}<span>${n.titulo ? `<b>${esc(n.titulo)}.</b> ` : ''}${linkify(n.texto)}</span></p>`).join('')}
  </section>`;
}

/* Tarjeta de Instagram (al final de Temporada): la cuenta del club, unas fotos del feed y el enlace al perfil.
   Instagram no deja leer el feed desde otra web sin una cuenta de desarrollador, así que las fotos las elige el club. */
function tarjetaInstagram(x) {
  const url = /^https:\/\/(www\.)?instagram\.com\/[\w.]+\/?$/.test(x.enlace || '') ? x.enlace : '';
  if (!url) return '';
  const cuenta = x.titulo || '@' + url.replace(/\/$/, '').split('/').pop();
  const fotos = (Array.isArray(x.fotos) ? x.fotos : []).filter(f => typeof f === 'string' && f);
  // filas completas de 3, como el perfil de Instagram (con 1 o 2 fotos, en una sola fila)
  const n = fotos.length >= 9 ? 9 : fotos.length >= 6 ? 6 : fotos.length >= 3 ? 3 : fotos.length;
  return `<a class="insta${n ? '' : ' sin-fotos'}" href="${esc(url)}" target="_blank" rel="noopener" aria-label="Abrir el Instagram del club, ${esc(cuenta)}">
    <span class="insta-head">
      <span class="insta-avatar"><svg viewBox="0 0 1000 516" aria-hidden="true"><use href="#logo-alas" fill="url(#oro)"/></svg></span>
      <span class="insta-quien"><b>${esc(cuenta)}</b>${x.texto ? `<span>${esc(x.texto)}</span>` : ''}</span>
      <span class="insta-ext">${ICON.ext}</span>
    </span>
    ${n ? `<span class="insta-grid" data-n="${Math.min(n, 3)}">${fotos.slice(0, n).map(f => `<img src="${esc(f)}" alt="" loading="lazy" decoding="async">`).join('')}</span>` : ''}
    <span class="insta-btn">${ICON.camera}<span>Ver en Instagram</span></span>
  </a>`;
}

/* =================================================================

function vCalendario() {
  const falta = necesitaInit('Competiciones');
  if (falta) return falta;
  const hoy = hoyRef();
  const finDe = e => e.fechaFin || e.fecha;
  const evs = (S.init.calendario || []).slice().sort((a, b) => a.fecha < b.fecha ? -1 : 1);
  const futuras = evs.filter(e => finDe(e) >= hoy);   // incluye las que están en curso
  const pasadas = evs.filter(e => finDe(e) < hoy).reverse();
  const prox = futuras[0];
  const mes3 = m => MESES[m - 1].slice(0, 3);
  let hero = '';
  if (prox) {
    const varios = !!prox.fechaFin;
    const a = parseYmd(prox.fecha), b = parseYmd(finDe(prox));
    const mismoMes = a.y === b.y && a.m === b.m;
    const n = diasEntre(hoy, prox.fecha);
    const cuenta = n < 0 ? 'En curso' : n === 0 ? (varios ? 'Empieza hoy' : 'Es hoy') : n === 1 ? (varios ? 'Empieza mañana' : 'Mañana') : `Faltan ${n} días`;
    const cuando = varios
      ? `Del ${DIAS[diaSemana(prox.fecha)]} ${a.d}${mismoMes ? '' : ` de ${MESES[a.m - 1]}`} al ${DIAS[diaSemana(finDe(prox))]} ${b.d} de ${MESES[b.m - 1]}`
      : `${cap(DIAS[diaSemana(prox.fecha)])} ${a.d} de ${MESES[a.m - 1]}`;
    hero = `<section class="next${varios ? ' varios' : ''}${prox.cartel ? ' con-cartel' : ''}" aria-label="Próxima competición">
      ${prox.cartel ? botonCartel(prox, 'next-cartel') : ''}
      <div class="next-date"><span class="next-num">${varios ? `${a.d}–${b.d}` : pad(a.d)}</span><span class="next-mon">${varios && !mismoMes ? `${mes3(a.m)}–${mes3(b.m)}` : mes3(a.m)}</span></div>
      <div class="next-body"><p class="next-label">Próxima competición</p><p class="next-name">${esc(prox.nombre)}</p>
        <p class="meta">${cuando}</p>
        ${prox.lugar ? `<p class="next-lugar">${ICON.pin}<span>${esc(prox.lugar)}</span></p>` : ''}
        ${prox.categoria ? `<p><span class="tag">${esc(prox.categoria)}</span></p>` : ''}
        ${prox.notas ? `<p class="note">${linkify(prox.notas)}</p>` : ''}
        ${prox.enlace ? `<p><a class="link" href="${esc(prox.enlace)}" target="_blank" rel="noopener">Más información</a></p>` : ''}
        <p class="next-pie"><span class="countdown">${cuenta}</span>${prox.cartel ? `<button class="next-ver" type="button" data-act="ver-cartel" data-src="${esc(prox.cartel)}" data-nombre="${esc(prox.nombre)}">${ICON.zoom}<span>Ver cartel</span></button>` : ''}</p></div>
    </section>`;
  }
  const grupo = (lista, pasada) => {
    let out = '', mesAct = '';
    lista.forEach(e => {
      const ym = e.fecha.slice(0, 7);
      if (ym !== mesAct) { mesAct = ym; out += `<h2 class="ev-month">${mesLabel(ym, true)}</h2>`; }
      const { d } = parseYmd(e.fecha);
      const num = e.fechaFin ? `${d}–${parseYmd(e.fechaFin).d}` : pad(d);
      const dia = e.fechaFin ? `${DIAS[diaSemana(e.fecha)].slice(0, 3)} a ${DIAS[diaSemana(e.fechaFin)].slice(0, 3)}` : DIAS[diaSemana(e.fecha)];
      out += `<article class="ev${pasada ? ' past' : ''}">
        <div class="dleft"><span class="dnum${e.fechaFin ? ' dnum-rango' : ''}">${num}</span><span class="dname">${dia}</span></div>
        <div class="ev-body"><p class="ev-name">${esc(e.nombre)}</p>
          ${e.lugar ? `<p class="meta">${esc(e.lugar)}</p>` : ''}
          ${e.categoria ? `<p><span class="tag">${esc(e.categoria)}</span></p>` : ''}
          ${e.notas ? `<p class="note">${linkify(e.notas)}</p>` : ''}
          ${e.enlace ? `<p><a class="link" href="${esc(e.enlace)}" target="_blank" rel="noopener">Más información</a></p>` : ''}
        </div>${e.cartel ? botonCartel(e, 'ev-cartel') : ''}</article>`;
    });
    return out;
  };
  const resto = futuras.slice(1);   // la próxima ya va destacada arriba
  return `<div class="view">${cabecera('Competiciones', 'Calendario de la temporada. Las fechas y sedes pueden cambiar; el club avisará de cualquier cambio.')}
    ${hero}
    ${resto.length ? `<div class="ev-list">${grupo(resto, false)}</div>` : ''}
    ${futuras.length ? '' : '<div class="empty"><p>No hay competiciones próximas en el calendario.</p></div>'}
    ${pasadas.length ? `<details class="past-block"><summary>Ya celebradas (${pasadas.length})</summary><div class="ev-list">${grupo(pasadas, true)}</div></details>` : ''}
  </div>`;
}

/* Cartel de una competición: al tocarlo se abre a pantalla completa (y se puede ampliar) */
const botonCartel = (e, cls) => `<button class="${cls}" type="button" data-act="ver-cartel" data-src="${esc(e.cartel)}" data-nombre="${esc(e.nombre)}" aria-label="Ver el cartel de ${esc(e.nombre)} en grande"><img src="${esc(e.cartel)}" alt="" loading="lazy" decoding="async"></button>`;

   PANEL DEL CLUB (ADMIN)

async function cargarAdmin() {
  S.admin.cargando = true; S.admin.error = '';
  const r = await API.admin('listar');
  S.admin.cargando = false;
  if (r.ok) { S.admin.data = r.data; }
  else if (r.code === 'auth') { salirAdmin(r.error); return; }
  else S.admin.error = r.error || 'No se han podido cargar los datos.';
  if (S.route === 'admin') render();
}
function salirAdmin(msg) {
  S.admin.pass = null; S.admin.data = null; S.admin.confirmar = null; sess.del('club-admin');
  render();
  if (msg) toast(msg);
}
function vAdmin() {
  if (!S.admin.pass) return vLogin();
  const titulos = { reservas: 'Reservas', pedidos: 'Pedidos', ajustes: 'Ajustes' };
  if (S.admin.error && !S.admin.data) return `<div class="view">${cabecera(titulos[S.admin.tab])}${errorBox(S.admin.error, 'admin-refrescar')}</div>`;

function vLogin() {
  return `<div class="view narrow">${cabecera('Panel del club', 'Acceso para la administración del club: reservas de clases y pedidos de ropa.')}

async function login(form) {
  const pw = String(form.elements.pass.value);
  const e = $('#l-err', form);
  if (!pw) { e.textContent = 'Escribe la contraseña.'; e.hidden = false; return; }
  const btn = form.querySelector('[type="submit"]');
  ocupado(btn, true, 'Entrando…');
  const r = await API.admin('login', { password: pw });
  ocupado(btn, false);
  if (!r.ok) { e.textContent = r.error || 'No se ha podido entrar.'; e.hidden = false; form.elements.pass.select(); return; }
  S.admin.pass = pw; sess.set('club-admin', pw);
  S.admin.data = null; S.admin.tab = 'reservas';
  render();
}
const filtroTexto = (r, q) => !q || `${r.nombre} ${r.telefono} ${r.email || ''} ${r.id}`.toLowerCase().includes(q.toLowerCase());
/* Reservas separadas en próximas, pasadas y canceladas (para la lista y para exportar) */
function gruposReservas(reservas) {
  const ahora = claveAhora();
  const k = r => `${r.fecha} ${r.hora}`;
  const act = reservas.filter(r => r.estado !== 'Cancelada');
  return {
    proximas: act.filter(r => k(r) >= ahora).sort((a, b) => k(a) < k(b) ? -1 : 1),
    pasadas: act.filter(r => k(r) < ahora).sort((a, b) => k(a) > k(b) ? -1 : 1),
    canceladas: reservas.filter(r => r.estado === 'Cancelada').sort((a, b) => k(a) > k(b) ? -1 : 1),
    todas: reservas.slice().sort((a, b) => k(a) < k(b) ? -1 : 1),
  };
}
const botonesCabecera = `<div class="head-acciones"><button class="btn btn-ghost btn-sm" type="button" data-act="exportar">${ICON.install}<span>Exportar</span></button>
      <button class="btn btn-ghost btn-sm" type="button" data-act="admin-refrescar">${ICON.refresh}<span>Actualizar</span></button></div>`;
function vAdminReservas() {
  const d = S.admin.data;
  const G = gruposReservas(d.reservas);
  const sem = sumaDias(hoyRef(), 7);

  const seg = [['proximas', 'Próximas'], ['pasadas', 'Pasadas'], ['canceladas', 'Canceladas']]

  const delGrupo = G[S.admin.filtroR] || [];
  const segT = [['todas', 'Todas'], ['Suelta', 'Clases sueltas'], ['Bono', 'Bonos']]
    .map(([id, t]) => `<button type="button" data-act="filtro-t" data-f="${id}" aria-pressed="${S.admin.filtroT === id}">${t}<span class="count">${delGrupo.filter(r => deTipo(r, id)).length}</span></button>`).join('');
  return `<div class="view">
    <header class="head head-row"><div><h1 class="h1">Reservas</h1><p class="lead">${estaSemana ? `${estaSemana} ${estaSemana === 1 ? 'clase' : 'clases'} en los próximos 7 días.` : 'Sin clases en los próximos 7 días.'}</p></div>
      ${botonesCabecera}</header>
    <div class="toolbar"><div class="seg" role="group" aria-label="Filtrar reservas">${seg}</div>
      <div class="seg seg-tipo" role="group" aria-label="Clase suelta o bono">${segT}</div>
      <label class="sr-only" for="a-q">Buscar</label><input class="input input-sm" id="a-q" type="search" placeholder="Buscar por nombre o teléfono" value="${esc(S.admin.q)}"></div>
    <div id="admin-list">${listaReservas(G[S.admin.filtroR])}</div>
  </div>`;
}
const tipoDe = r => (r.tipo === 'Bono' ? 'Bono' : 'Suelta');
const deTipo = (r, f) => !f || f === 'todas' || tipoDe(r) === f;
const hayBono = () => { const a = ajustes(); return !!(a.precioBono && Number(a.clasesBono)); };
const tipoTxt = t => (t === 'Bono' ? `Bono de ${Number(ajustes().clasesBono) || 5} clases` : 'Clase suelta');
function listaReservas(lista) {
  const q = S.admin.q.trim();
  const items = lista.filter(r => filtroTexto(r, q) && deTipo(r, S.admin.filtroT));
  if (!items.length) {
    const vacio = { proximas: 'No hay reservas próximas. Cuando una familia reserve una clase, aparecerá aquí.', pasadas: 'Todavía no hay clases pasadas.', canceladas: 'No hay reservas canceladas.' }[S.admin.filtroR];
    return `<div class="empty"><p>${q ? 'Ninguna reserva coincide con la búsqueda.' : vacio}</p></div>`;
  }
  let out = '', fAct = '';

    if (r.fecha !== fAct) { fAct = r.fecha; out += `<h2 class="group-h">${cap(fechaLarga(r.fecha))}</h2>`; }
    const msg = `Hola, te escribimos de ${CONFIG.CLUB} por la clase del ${fechaLarga(r.fecha)} a las ${r.hora}.`;
    const futura = r.estado !== 'Cancelada' && `${r.fecha} ${r.hora}` >= claveAhora();
    let acciones = `<a class="btn btn-ghost btn-sm" href="${waUrl(r.telefono, msg)}" target="_blank" rel="noopener">${ICON.chat}<span>WhatsApp</span></a>`;
    if (futura) {
      acciones += S.admin.confirmar === r.id
        ? `<span class="confirm-q">¿Cancelar esta reserva?</span><button class="btn btn-danger btn-sm" type="button" data-act="cancelar-si" data-id="${esc(r.id)}">Sí, cancelar</button><button class="btn btn-ghost btn-sm" type="button" data-act="cancelar-no">No</button>`
        : `<button class="btn btn-ghost btn-sm btn-quiet-danger" type="button" data-act="cancelar-pedir" data-id="${esc(r.id)}">Cancelar</button>`;
    }
    out += `<article class="row">
      <div class="time">${esc(r.hora)}</div>
      <div class="row-main">
        <p class="who">${esc(r.nombre)} <span class="tipo-chip${tipoDe(r) === 'Bono' ? ' bono' : ''}">${tipoDe(r) === 'Bono' ? 'Bono' : 'Suelta'}</span>${r.estado === 'Cancelada' ? ' <span class="status s-cancelada">Cancelada</span>' : ''}</p>
        <p class="meta"><span class="sel">${esc(r.telefono)}</span>${r.email ? `, <span class="sel">${esc(r.email)}</span>` : ''}</p>
        ${r.comentario ? `<p class="note">${esc(r.comentario)}</p>` : ''}
        <p class="meta small">${esc(r.id)}, reservada el ${esc(r.creada || '')}</p>
        <div class="actions">${acciones}</div>
      </div></article>`;
  });
  return out;
}
/* Unidades por prenda y talla, sin contar los pedidos cancelados (para el proveedor) */
function resumenProveedor(pedidos) {
  const res = {};
  pedidos.filter(p => p.estado !== 'Cancelado').forEach(p => (p.lineas || []).forEach(l => {
    const r = res[l.nombre] || (res[l.nombre] = { total: 0, tallas: {} });
    r.total += l.cantidad; r.tallas[l.talla] = (r.tallas[l.talla] || 0) + l.cantidad;
  }));
  return res;
}
const pedidosOrdenados = d => d.pedidos.slice().sort((a, b) => a.id < b.id ? 1 : -1);
const pedidosDe = (peds, f) => peds.filter(p => f === 'todos' || p.estado.toLowerCase() === f);
function vAdminPedidos() {
  const d = S.admin.data;
  const peds = pedidosOrdenados(d);
  const vivos = peds.filter(p => p.estado !== 'Cancelado');
  const res = resumenProveedor(peds);
  const importe = vivos.reduce((s, p) => s + Number(p.total || 0), 0);
  const pendiente = vivos.filter(p => p.estado === 'Pendiente').reduce((s, p) => s + Number(p.total || 0), 0);
  const filas = Object.keys(res).sort().map(n => {
    const tallas = Object.keys(res[n].tallas).sort((a, b) => ordenTalla(a) - ordenTalla(b));
    return `<li class="sum-row"><span class="sum-name">${esc(n)}</span><span class="sum-total">${res[n].total} ${res[n].total === 1 ? 'ud.' : 'uds.'}</span><span class="sum-sizes">${tallas.map(t => `<span class="chip">${/^[uú]nica$/i.test(t) ? 'Única' : esc(t)} <b>×${res[n].tallas[t]}</b></span>`).join('')}</span></li>`;
  }).join('');
  const cuenta = f => f === 'todos' ? peds.length : peds.filter(p => p.estado.toLowerCase() === f).length;
  const seg = [['todos', 'Todos'], ['pendiente', 'Pendientes'], ['pagado', 'Pagados'], ['entregado', 'Entregados'], ['cancelado', 'Cancelados']]
    .map(([id, t]) => `<button type="button" data-act="filtro-p" data-f="${id}" aria-pressed="${S.admin.filtroP === id}">${t}<span class="count">${cuenta(id)}</span></button>`).join('');
  const lista = pedidosDe(peds, S.admin.filtroP);
  const cards = lista.map(p => {
    const msg = `Hola, te escribimos de ${CONFIG.CLUB} por tu pedido de ropa ${p.id}.`;
    return `<article class="order">
      <div class="order-top"><span class="ref">${esc(p.id)}</span><span class="status s-${esc(p.estado.toLowerCase())}">${esc(p.estado)}</span><span class="meta small">${esc(p.creado || '')}</span></div>
      <p class="who">${esc(p.nombre)}</p>
      <p class="meta"><span class="sel">${esc(p.telefono)}</span>${p.email ? `, <span class="sel">${esc(p.email)}</span>` : ''}</p>
      <ul class="order-lines">${(p.lineas || []).map(l => `<li><span>${esc(l.nombre)}, ${tallaTxt(l.talla)} ×${l.cantidad}</span><span>${euros(l.precio * l.cantidad)}</span></li>`).join('')}</ul>
      <p class="total-row total-sm"><span>Total</span><b>${euros(Number(p.total || 0))}</b></p>
      ${p.observaciones ? `<p class="note">${esc(p.observaciones)}</p>` : ''}
      <div class="actions"><label class="sr-only" for="st-${esc(p.id)}">Estado del pedido ${esc(p.id)}</label>
        <select class="input input-sm select" id="st-${esc(p.id)}" data-change="estado" data-id="${esc(p.id)}">${ESTADOS_PEDIDO.map(s => `<option${s === p.estado ? ' selected' : ''}>${s}</option>`).join('')}</select>
        <a class="btn btn-ghost btn-sm" href="${waUrl(p.telefono, msg)}" target="_blank" rel="noopener">${ICON.chat}<span>WhatsApp</span></a></div>
    </article>`;
  }).join('');
  return `<div class="view">
    <header class="head head-row"><div><h1 class="h1">Pedidos</h1><p class="lead">${vivos.length} ${vivos.length === 1 ? 'pedido' : 'pedidos'}, ${euros(importe)} en total. Pendiente de cobro: ${euros(pendiente)}.</p></div>
      ${botonesCabecera}</header>
    ${filas ? `<section class="summary" aria-labelledby="sum-h"><h2 class="h2" id="sum-h">Resumen para el proveedor</h2><p class="meta">Unidades por prenda y talla, sin contar pedidos cancelados.</p><ul class="sum-list">${filas}</ul></section>` : ''}
    <div class="toolbar"><div class="seg" role="group" aria-label="Filtrar pedidos">${seg}</div></div>
    <div class="orders">${cards || '<div class="empty"><p>No hay pedidos en esta lista.</p></div>'}</div>
  </div>`;
}

/* =================================================================
   EXPORTAR (Excel y PDF) DESDE EL PANEL
   ================================================================= */
const QUE_RESERVAS = [['proximas', 'Próximas'], ['pasadas', 'Pasadas'], ['canceladas', 'Canceladas'], ['todas', 'Todas']];
const QUE_PEDIDOS = [['todos', 'Todos'], ['pendiente', 'Pendientes'], ['pagado', 'Pagados'], ['entregado', 'Entregados'], ['cancelado', 'Cancelados']];
const MIME_XLSX = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

/* Lo que se exporta: la lista elegida (y, en reservas, con la búsqueda aplicada) */
function datosExportar(tab, que) {
  const d = S.admin.data;
  if (tab === 'pedidos') {
    const lista = pedidosDe(pedidosOrdenados(d), que).slice().reverse();   // del más antiguo al más nuevo
    return { lista, nombre: (QUE_PEDIDOS.find(x => x[0] === que) || ['', 'Todos'])[1] };
  }
  const q = S.admin.q.trim();
  const lista = (gruposReservas(d.reservas)[que] || []).filter(r => filtroTexto(r, q) && deTipo(r, S.admin.filtroT));
  if (que !== 'proximas') lista.sort((a, b) => (`${a.fecha} ${a.hora}` < `${b.fecha} ${b.hora}` ? -1 : 1));
  const t = S.admin.filtroT !== 'todas' ? (S.admin.filtroT === 'Bono' ? ' · bonos' : ' · clases sueltas') : '';
  return { lista, nombre: (QUE_RESERVAS.find(x => x[0] === que) || ['', 'Todas'])[1] + t, q };
}
function hojaExportar() {
  const tab = S.admin.tab === 'pedidos' ? 'pedidos' : 'reservas';
  const d = S.admin.data;
  const opciones = tab === 'pedidos' ? QUE_PEDIDOS : QUE_RESERVAS;
  const actual = tab === 'pedidos' ? S.admin.filtroP : S.admin.filtroR;
  const n = que => datosExportar(tab, que).lista.length;
  const q = tab === 'reservas' ? S.admin.q.trim() : '';
  // se van cargando la librería del PDF y el logotipo mientras se elige
  libPDF().catch(() => {}); logoPNG();
  return `<div class="sheet-head"><h2 class="h2" id="sheet-title" tabindex="-1">Exportar ${tab}</h2>${btnCerrar}</div>
    <form class="form exp" id="f-exportar" data-tab="${tab}" novalidate>
      <fieldset class="exp-que"><legend class="label">Qué quieres exportar</legend>
        <div class="exp-ops">${opciones.map(([id, t]) => `<label class="exp-op"><input type="radio" name="que" value="${id}"${id === actual ? ' checked' : ''}><span>${t}</span><span class="count">${n(id)}</span></label>`).join('')}</div>
        ${q ? `<p class="meta">Solo las que coinciden con la búsqueda «${esc(q)}».</p>` : ''}
        ${tab === 'reservas' && S.admin.filtroT !== 'todas' ? `<p class="meta">Solo ${S.admin.filtroT === 'Bono' ? 'las de bono' : 'las clases sueltas'}, como en el filtro del panel.</p>` : ''}
      </fieldset>
      <div class="exp-formatos">
        <button class="exp-btn" type="button" data-act="exportar-a" data-formato="xlsx"><span class="exp-ico">${ICON.sheet}</span><span class="exp-txt"><b>Excel</b><small>Para ordenar, filtrar y sumar</small></span></button>
        <button class="exp-btn" type="button" data-act="exportar-a" data-formato="pdf"><span class="exp-ico">${ICON.doc}</span><span class="exp-txt"><b>PDF</b><small>Para imprimir o enviar</small></span></button>
      </div>

async function exportar(tab, que, formato) {
  const { lista, nombre, q } = datosExportar(tab, que);

  const ahora = new Date();
  const cuando = `exportado el ${pad(ahora.getDate())}/${pad(ahora.getMonth() + 1)}/${ahora.getFullYear()} a las ${pad(ahora.getHours())}:${pad(ahora.getMinutes())}`;
  const cuenta = `${lista.length} ${tab === 'pedidos' ? (lista.length === 1 ? 'pedido' : 'pedidos') : (lista.length === 1 ? 'reserva' : 'reservas')}`;
  const sub = `${nombre}${q ? ` («${q}»)` : ''} · ${cuenta} · ${cuando}`;

/* ---------- guardar el archivo: vista previa de Claude, compartir en el móvil o descarga ---------- */
/* La vista previa publicada (claude.ai) da `claude.use` a la página; la app va dentro de un marco del mismo origen */
function claudeHost() {
  try {
    if (window.claude && typeof window.claude.use === 'function') return window;
    if (window.parent !== window && window.parent.claude && typeof window.parent.claude.use === 'function') return window.parent;
  } catch (e) { /* marco de otro origen */ }
  return null;
}
const esTactil = () => !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
async function guardarArchivo(nombre, datos, tipo) {
  const blob = new Blob([datos], { type: tipo });
  // 1) Dentro de la vista previa publicada: el visor pide permiso y guarda el archivo
  const w = window.__CLUB_BUILD__ === 'artifact' ? claudeHost() : null;
  if (w) {
    let dl = null;
    try { dl = await w.claude.use('downloads'); } catch (e) { dl = null; }
    if (dl) {
      // los bytes se crean en la ventana que tiene `claude`, por si comprueba el tipo
      const u8 = new w.Uint8Array(datos.length); u8.set(datos);
      try { await dl.save({ filename: nombre, data: u8 }); return 'ok'; } catch (e) {
        const c = e && e.code;
        if (c === 'declined') return 'cancelado';
        if (c === 'rate_limited') throw new Error('Ya hay una descarga esperando. Prueba de nuevo en un momento.');
        // otros casos: se intenta la descarga normal
      }
    }
  }
  // 2) En el móvil: menú de compartir (Guardar en Archivos, WhatsApp, Mail…)
  if (esTactil() && typeof File === 'function' && navigator.canShare) {
    const f = new File([blob], nombre, { type: tipo });
    if (navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f], title: nombre }); return 'ok'; } catch (e) {
        if (e && e.name === 'AbortError') return 'cancelado';
        // NotAllowedError y similares: descarga normal
      }
    }
  }
  // 3) Descarga normal
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return 'ok';
}

      const img = new Image();
      img.onload = () => {
        try { const c = document.createElement('canvas'); c.width = 800; c.height = 413; c.getContext('2d').drawImage(img, 0, 0, 800, 413); ok(c.toDataURL('image/png')); } catch (e) { ok(null); }
      };
      img.onerror = () => ok(null);

}
/* Las fuentes estándar del PDF solo tienen los caracteres de Europa occidental: lo demás se simplifica (ł → l) */
const WINANSI = new Set([...'€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ'].map(c => c.charCodeAt(0)));
function pdfTxt(v) {
  return [...String(v == null ? '' : v).replace(/[\u00A0\u2007\u2009\u202F]/g, ' ')].map(c => {
    const n = c.charCodeAt(0);
    if (c === '\n' || (n >= 32 && n <= 126) || (n >= 160 && n <= 255) || WINANSI.has(n)) return c;
    const b = c.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return b && [...b].every(k => k.charCodeAt(0) < 256) ? b : '?';
  }).join('');
}
async function pdfNuevo(titulo, sub) {
  const J = await libPDF();
  const logo = await logoPNG();
  const doc = new J({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true });
  doc.setProperties({ title: `${titulo} · ${CONFIG.CLUB}`, subject: sub, author: CONFIG.CLUB, creator: CONFIG.CLUB });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const marco = () => {
    doc.setFillColor(11, 11, 12); doc.rect(0, 0, W, 24, 'F');
    doc.setFillColor(227, 194, 90); doc.rect(0, 24, W, 0.9, 'F');
    let x = 12;
    if (logo) { try { doc.addImage(logo, 'PNG', 12, 5.2, 26, 13.4); x = 44; } catch (e) { /* sin logotipo */ } }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(227, 194, 90); doc.text(titulo, x, 12.2);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(205, 199, 186); doc.text(pdfTxt(sub), x, 18.4);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(227, 194, 90); doc.text(CONFIG.CLUB.toUpperCase(), W - 12, 12.2, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(122, 115, 101);
    doc.text(`${CONFIG.CLUB} · ${titulo}`, 12, H - 7);
    doc.text(`Página ${doc.internal.getCurrentPageInfo().pageNumber} de {total}`, W - 12, H - 7, { align: 'right' });
  };
  const tabla = opts => {
    const o = Object.assign({
      theme: 'grid', margin: { top: 31, right: 12, bottom: 14, left: 12 },
      styles: { font: 'helvetica', fontSize: 8.5, cellPadding: 2.2, textColor: [20, 17, 10], lineColor: [230, 223, 204], lineWidth: 0.15, valign: 'top' },
      headStyles: { fillColor: [11, 11, 12], textColor: [227, 194, 90], fontStyle: 'bold', lineColor: [11, 11, 12] },
      alternateRowStyles: { fillColor: [248, 245, 238] },
      didDrawPage: marco,
    }, opts);
    o.head = (o.head || []).map(f => f.map(pdfTxt));
    o.body = (o.body || []).map(f => f.map(pdfTxt));
    if (typeof doc.autoTable === 'function') doc.autoTable(o); else window.autoTable(doc, o);
    return doc.lastAutoTable ? doc.lastAutoTable.finalY : 40;
  };
  const fin = () => { if (typeof doc.putTotalPages === 'function') doc.putTotalPages('{total}'); return new Uint8Array(doc.output('arraybuffer')); };
  return { doc, W, H, tabla, fin };
}
async function pdfReservas(lista, sub) {
  const P = await pdfNuevo('Reservas de clases particulares', sub);
  P.tabla({
    head: [['Fecha', 'Hora', 'Deportista', 'Teléfono', 'Tipo', 'Comentario', 'Estado', 'Ref.']],
    body: lista.map(r => { const f = parseYmd(r.fecha); return [`${diaCorto(r.fecha)} ${pad(f.d)}/${pad(f.m)}/${f.y}`, r.hora, r.nombre, r.telefono, tipoTxt(tipoDe(r)), r.comentario || '', r.estado, r.id]; }),
    columnStyles: { 0: { cellWidth: 30 }, 1: { cellWidth: 15 }, 2: { cellWidth: 50, fontStyle: 'bold' }, 3: { cellWidth: 28 }, 4: { cellWidth: 34 }, 5: { cellWidth: 'auto' }, 6: { cellWidth: 22 }, 7: { cellWidth: 17 } },
    didParseCell: h => { if (h.section === 'body' && lista[h.row.index] && lista[h.row.index].estado === 'Cancelada') { h.cell.styles.textColor = [150, 143, 130]; h.cell.styles.fontStyle = 'italic'; } },

}
async function pdfPedidos(lista, sub) {
  const P = await pdfNuevo('Pedidos de ropa', sub);
  const vivos = lista.filter(p => p.estado !== 'Cancelado');
  const total = vivos.reduce((s, p) => s + Number(p.total || 0), 0);
  const pendiente = vivos.filter(p => p.estado === 'Pendiente').reduce((s, p) => s + Number(p.total || 0), 0);
  let y = P.tabla({
    head: [['Ref.', 'Hecho el', 'Deportista', 'Teléfono', 'Prendas', 'Total', 'Estado']],
    body: lista.map(p => [p.id, p.creado || '', p.nombre, p.telefono, lineasTxt(p) + (p.observaciones ? `\nObs.: ${p.observaciones}` : ''), euros(Number(p.total || 0)), p.estado]),
    columnStyles: { 0: { cellWidth: 17 }, 1: { cellWidth: 31 }, 2: { cellWidth: 44, fontStyle: 'bold' }, 3: { cellWidth: 28 }, 4: { cellWidth: 'auto' }, 5: { cellWidth: 20, halign: 'right', fontStyle: 'bold' }, 6: { cellWidth: 22 } },
    didParseCell: h => { if (h.section === 'body' && lista[h.row.index] && lista[h.row.index].estado === 'Cancelado') { h.cell.styles.textColor = [150, 143, 130]; h.cell.styles.fontStyle = 'italic'; } },
  });
  const { doc, H } = P;
  if (y > H - 40) { doc.addPage(); y = 31; }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(20, 17, 10);
  doc.text(pdfTxt(`Total (sin cancelados): ${euros(total)}   ·   Pendiente de cobro: ${euros(pendiente)}`), 12, y + 8);
  const resumen = filasResumen(lista);
  if (resumen.length) {
    if (y + 30 > H - 20) { doc.addPage(); y = 23; }
    doc.setFontSize(12); doc.text('Resumen para el proveedor', 12, y + 18);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(122, 115, 101);
    doc.text('Unidades por prenda y talla, sin contar los pedidos cancelados.', 12, y + 23);
    P.tabla({
      startY: y + 26, tableWidth: 150,
      head: [['Prenda', 'Talla', 'Unidades']],
      body: resumen,
      columnStyles: { 0: { cellWidth: 80, fontStyle: 'bold' }, 1: { cellWidth: 40 }, 2: { cellWidth: 30, halign: 'center' } },
    });
  }
  return P.fin();
}

/* ---------- visor de fotos a pantalla completa ---------- */
const visor = {
  el: null,
  prev: null,
  abrir(p, i, tono) {
    const fs = fotosDe(p); if (!fs.length) return;
    this.prev = document.activeElement;
    const d = document.createElement('div');
    d.className = 'visor' + (tono ? ' ' + tono : '');
    d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-label', `Fotos: ${p.nombre}`);
    d.innerHTML = `<div class="visor-track">${fs.map((f, k) => `<div class="visor-item"><img src="${esc(f)}" alt="${esc(p.nombre)}${fs.length > 1 ? `, foto ${k + 1} de ${fs.length}` : ''}" data-act="zoom" draggable="false"></div>`).join('')}</div>
      <button class="visor-x" type="button" data-act="cerrar-visor" aria-label="Cerrar">${ICON.close}</button>
      ${fs.length > 1 ? `<button class="visor-nav ant" type="button" data-act="visor-mover" data-d="-1" aria-label="Foto anterior">${ICON.back}</button><button class="visor-nav sig" type="button" data-act="visor-mover" data-d="1" aria-label="Foto siguiente">${ICON.fwd}</button>` : ''}
      <p class="visor-pie">${fs.length > 1 ? `<span class="visor-n">${i + 1} / ${fs.length}</span> · ` : ''}Toca la foto para ampliarla</p>`;
    document.body.appendChild(d);
    this.el = d;
    const tr = d.querySelector('.visor-track');
    tr.scrollLeft = i * tr.clientWidth;
    const n = d.querySelector('.visor-n');
    tr.addEventListener('scroll', () => { if (n) n.textContent = `${Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth)) + 1} / ${fs.length}`; }, { passive: true });
    bloquear(true);
    d.querySelector('.visor-x').focus({ preventScroll: true });
  },
  cerrar() {
    if (!this.el) return;
    this.el.remove(); this.el = null;
    bloquear(false);
    if (this.prev && document.contains(this.prev)) { try { this.prev.focus({ preventScroll: true }); } catch (e) { /* nada */ } }
  },
  normal() { if (!this.el) return; this.el.classList.remove('zoomed'); this.el.querySelectorAll('.visor-item.zoom').forEach(x => { x.classList.remove('zoom'); x.scrollTop = 0; x.scrollLeft = 0; }); },
  zoom(img, e) {
    const it = img.parentElement;
    if (it.classList.contains('zoom')) return this.normal();
    const r = img.getBoundingClientRect();
    const fx = r.width ? (e.clientX - r.left) / r.width : .5, fy = r.height ? (e.clientY - r.top) / r.height : .5;
    it.classList.add('zoom'); this.el.classList.add('zoomed');
    it.scrollLeft = Math.max(0, fx * img.offsetWidth - it.clientWidth / 2);
    it.scrollTop = Math.max(0, fy * img.offsetHeight - it.clientHeight / 2);
  },
  mover(dir) {
    if (!this.el) return;
    this.normal();
    const tr = this.el.querySelector('.visor-track');
    tr.scrollBy({ left: dir * tr.clientWidth, behavior: 'smooth' });
  },
};

    } catch (e) {
      err.textContent = (e && e.message) || 'No se ha podido exportar.'; err.hidden = false;
    } finally {

    const r = await API.admin('probarAvisos');
    t.disabled = false;
    if (!r.ok) { if (r.code === 'auth') return salirAdmin(r.error); out.innerHTML = `<p class="err">${esc(r.error)}</p>`; return; }
    const res = r.data.resultados || [];
    out.innerHTML = res.length
      ? `<ul class="results">${res.map(x => `<li><span class="status ${x.ok ? 's-entregado' : 's-cancelada'}">${x.ok ? 'Enviado' : 'Error'}</span> <b>${esc(x.canal)}</b> <span class="meta">${esc(x.detalle || '')}</span></li>`).join('')}</ul>`
      : '<p class="err">No hay ningún canal de aviso configurado. Revisa CONFIG.AVISOS en Code.gs.</p>';

function onClick(e) {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(t, e);
}
function onSubmit(e) {
  const f = e.target;
  e.preventDefault();
  if (f.id === 'f-reserva') enviarReserva(f);
  else if (f.id === 'f-pedido') enviarPedido(f);
  else if (f.id === 'f-login') login(f);
  else if (f.id === 'f-ins') enviarFicha(f);
}
async function onChange(e) {
  const t = e.target;
  if (t.closest && t.closest('#f-ins')) { cambioFicha(t); return; }
  if (t.dataset.change === 'estado') {
    const id = t.dataset.id, estado = t.value;
    t.disabled = true;
    const r = await API.admin('estadoPedido', { id, estado });
    t.disabled = false;
    if (!r.ok) { if (r.code === 'auth') return salirAdmin(r.error); toast(r.error || 'No se ha podido cambiar el estado.'); return renderView(); }
    const p = S.admin.data.pedidos.find(z => z.id === id); if (p) p.estado = estado;
    renderView();
    toast(`${id}: ${estado.toLowerCase()}.`);
  }
}
function onInput(e) {
  if (e.target.id === 'a-q') {
    S.admin.q = e.target.value;
    const box = $('#admin-list');
    const d = S.admin.data; if (!box || !d) return;
    const lista = gruposReservas(d.reservas)[S.admin.filtroR] || [];
    box.innerHTML = listaReservas(lista);
  }
}
function onKey(e) {
  if (visor.el) {
    if (e.key === 'Escape') visor.cerrar();
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') visor.mover(e.key === 'ArrowRight' ? 1 : -1);
    return;
  }
  if (e.key === 'Escape') { if (sheet.isOpen()) sheet.close(); else cerrarMenu(); }
}

/* ---------- arranque ---------- */
async function cargarInit() {
  const r = await API.init();
  if (r.ok && r.data) {
    S.init = r.data; S.initError = '';
    if (!DEMO) store.set('club-init', r.data);
    limpiarCarrito();
  } else if (!S.init) {
    S.initError = r.error || 'No se ha podido cargar la información del club.';
  }
  render();
}
function arrancar() {
  cacheEls();
  S.admin.pass = sess.get('club-admin');
  S.carrito = store.get('club-carrito', []) || [];
  if (!DEMO) { const c = store.get('club-init', null); if (c && c.ajustes) S.init = c; }
  let h = '';
  try { h = (location.hash || '').replace('#', ''); } catch (e) { /* nada */ }
  if (RUTAS.includes(h)) S.route = h;
  document.addEventListener('click', onClick);
  document.addEventListener('submit', onSubmit);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', onKey);
  window.addEventListener('hashchange', () => { const r = location.hash.replace('#', ''); if (RUTAS.includes(r) && r !== S.route) ir(r); });
  window.addEventListener('scroll', () => el.top.classList.toggle('scrolled', window.scrollY > 4), { passive: true });
  if (window.matchMedia) {
    const mq = window.matchMedia('(min-width: 900px)');
    const f = () => { if (mq.matches) cerrarMenu(); };
    if (mq.addEventListener) mq.addEventListener('change', f); else if (mq.addListener) mq.addListener(f);
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptInstalar = e; renderNav(); });
  render();
  cargarInit();
  if (BUILD === 'web' && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => { /* sin modo offline */ }); });
  }
  // Actualización automática: al volver a la app, si en GitHub hay una versión nueva, se recarga sola
  // (sin reinstalar nada). Nunca a mitad de una reserva o un pedido.
  if (BUILD === 'web' && /^[0-9a-f]{8,}$/.test(VERSION_APP)) {
    let ultima = Date.now();
    const comprobar = async () => {
      if (document.visibilityState !== 'visible' || Date.now() - ultima < 60000) return;
      ultima = Date.now();
      try {
        const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
        const v = r.ok ? (await r.json()).version : '';
        if (!v || v === VERSION_APP) return;
        if (navigator.serviceWorker) { const reg = await navigator.serviceWorker.getRegistration(); if (reg) reg.update().catch(() => {}); }
        const recargar = () => { if (!sheet.isOpen() && !document.querySelector('.visor') && !document.querySelector('form :focus') && !document.getElementById('f-ins') && !S.fichaBorrador) location.reload(); else setTimeout(recargar, 5000); };
        recargar();
      } catch (e) { /* sin conexión: ya se mirará la próxima vez */ }
    };
    document.addEventListener('visibilitychange', comprobar);
    setInterval(comprobar, 30 * 60000);
  }
}
arrancar();
