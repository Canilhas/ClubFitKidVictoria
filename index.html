<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club Fit Kid Victoria</title>
<meta name="description" content="App del club: reserva de clases particulares, pedidos de ropa, información de la temporada y calendario de competiciones.">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Victoria">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400..700;1,400..700&family=Manrope:wght@400..800&display=swap" media="print" onload="this.media='all'">
<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: menú lateral (cajón en el móvil) + una columna de tarjetas negras con detalles dorados. */
:root {
  /* Colores del club Victoria: negro y el dorado del logotipo alado */
  color-scheme: dark;
  --bg: #0B0B0C;
  --bar: rgba(11, 11, 12, .6);
  --surface: #151516;
  --surface-2: #1D1D20;
  --surface-3: #29292D;
  --line: #2B2B30;
  --ink: #F4F1EA;
  --muted: #A39F95;
  --gold: #E3C25A;
  --gold-hi: #EDD58C;
  --gold-deep: #B08732;
  --gold-grad: linear-gradient(180deg, #EFD995 0%, #E4C150 55%, #D6AE3E 100%);
  --gold-ink: #0B0B0C;
  --gold-soft: #2A2416;
  --gold-ring: rgba(227, 194, 90, .3);
  --logo-letras: #A68A4C;
  --tile: #F4F2F3;            /* fondo claro de las fotos de producto */
  /* texturas de las tarjetas: negro y oro cepillados */
  --fondo-negro:
    radial-gradient(120% 90% at 100% 0%, rgba(227, 194, 90, .11), rgba(227, 194, 90, 0) 55%),
    repeating-linear-gradient(105deg, rgba(255, 255, 255, .022) 0 1px, rgba(255, 255, 255, 0) 1px 4px),
    linear-gradient(160deg, #1B1B1D 0%, #111112 55%, #0C0C0D 100%);
  --fondo-oro:
    radial-gradient(110% 130% at 0% 0%, rgba(255, 249, 226, .5), rgba(255, 249, 226, 0) 48%),
    repeating-linear-gradient(105deg, rgba(255, 255, 255, .08) 0 1px, rgba(110, 78, 18, .05) 1px 4px),
    linear-gradient(115deg, #B68E38 0%, #DDB843 24%, #F0DA98 50%, #E2BE4C 74%, #B38A33 100%);
  --ok: #7BD3A0;
  --ok-soft: #13261B;
  --warn: #E9B35E;
  --warn-soft: #2C2312;
  --bad: #FF8A7A;
  --bad-soft: #2E1614;
  --bubble: #144D37;
  --bubble-ink: #E9EDEF;
  --chat-bg: #0B141A;
  --scrim: rgba(0, 0, 0, .68);
  --shadow: 0 24px 64px rgba(0, 0, 0, .6);

  --font: "Manrope", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --display: "Jost", "Futura", "Century Gothic", "Manrope", Arial, sans-serif;
  --fs-xs: .8125rem;
  --fs-sm: .875rem;
  --fs-md: 1rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.375rem;
  --fs-2xl: 1.875rem;
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 22px;
  --pill: 999px;
  --nav-w: 280px;
  --top-h: 60px;
}

/* ---------- base ---------- */
/* foto de fondo de toda la app, muy difuminada y oscurecida, fija al hacer scroll */
.app-fondo { position: fixed; inset: -30px; z-index: -1; background-position: center 35%; background-size: cover; filter: grayscale(1) blur(10px) contrast(1.05); opacity: .6; pointer-events: none; }
.app-fondo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11, 11, 12, .35), rgba(11, 11, 12, .55) 55%, rgba(11, 11, 12, .7)); }   /* oscurece lo justo para leer */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--fs-md);
  font-weight: 500;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 25;
  background: var(--bg);
}
.lock, .lock body { overflow: hidden; }
p, h1, h2, h3, ul, dl, dd, figure { margin: 0; }
ul { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#view:focus { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
svg { display: block; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.logo-letras { fill: var(--logo-letras); }

/* ---------- estructura ---------- */
.app { min-height: 100%; }
.main { min-width: 0; }
.main-in {
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  max-width: 760px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 64px;
}
body.has-cart .main-in { padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }

/* barra superior (móvil) */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bar);
  -webkit-backdrop-filter: saturate(140%) blur(14px);
  backdrop-filter: saturate(140%) blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s;
}
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar-in {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) 44px;
  align-items: center;
  gap: 8px;
  height: var(--top-h);
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.icon-btn {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border: 0; border-radius: var(--pill);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:hover { background: var(--surface-2); }
/* alas del logotipo, centradas en la barra */
.top-mark {
  justify-self: center;
  display: grid;
  place-items: center;
  height: 44px;
  padding-inline: 10px;
  border-radius: var(--pill);
  transition: opacity .2s;
}
.top-mark svg { width: 58px; height: auto; }
body.en-inicio .topbar:not(.scrolled) .top-mark { opacity: 0; pointer-events: none; }

/* menú lateral: cajón en el móvil, carril fijo en el ordenador */
.nav {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 50;
  width: min(86vw, 330px);
  display: flex;
  flex-direction: column;
  gap: 30px;
  background: var(--surface);
  border-right: 1px solid var(--line);
  padding-top: calc(env(safe-area-inset-top, 0px) + 26px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: 14px;
  overflow-y: auto;
  transform: translateX(-104%);
  visibility: hidden;
  transition: transform .28s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .28s;
}
.nav.open {
  transform: none;
  visibility: visible;
  box-shadow: var(--shadow);
  transition: transform .28s cubic-bezier(.2, .8, .2, 1), visibility 0s;
}
.drawer-scrim { position: fixed; inset: 0; z-index: 45; background: var(--scrim); }
.brand {
  display: grid;
  justify-items: start;
  gap: 12px;
  padding: 4px 14px 0;
  color: inherit;
  text-decoration: none;
}
.brand-logo { width: 164px; height: auto; }
.brand-season {
  color: var(--muted);
  font-family: var(--display);
  font-size: .75rem;
  font-weight: 500;
  letter-spacing: .18em;
  text-transform: uppercase;
}
.brand-season:empty { display: none; }
.tabs { display: grid; gap: 4px; }
.nav-mode { color: var(--muted); font-size: var(--fs-xs); font-weight: 700; padding: 0 14px 6px; }
.tab {
  display: flex; align-items: center; gap: 14px;
  min-height: 52px;
  padding: 0 14px;
  border: 0; border-radius: var(--r-md);
  background: transparent;
  color: var(--ink);
  font-size: 1.0625rem;
  font-weight: 600;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
}
.tab svg { width: 22px; height: 22px; flex: none; color: var(--muted); }
.tab:hover { background: var(--surface-2); }
.tab[aria-current="page"] { background: var(--surface-2); color: var(--gold); font-weight: 700; }
.tab[aria-current="page"] svg { color: var(--gold); }
.nav-foot { margin-top: auto; display: grid; gap: 2px; }
.nav-motto {
  display: grid;
  gap: 4px;
  margin: 0 14px 14px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}
.nav-motto-1 { color: var(--gold); font-family: var(--display); font-size: .6875rem; font-weight: 500; letter-spacing: .16em; line-height: 1.5; text-transform: uppercase; text-wrap: balance; }
.nav-motto-2 { color: var(--muted); font-size: var(--fs-xs); font-weight: 500; line-height: 1.4; text-wrap: balance; }
.nav-link {
  display: flex; align-items: center; gap: 12px;
  min-height: 44px; padding: 0 14px;
  border: 0; border-radius: var(--r-sm);
  background: transparent; color: var(--muted);
  font-size: var(--fs-sm); font-weight: 600;
  text-align: left; text-decoration: none; cursor: pointer;
}
.nav-link svg { width: 18px; height: 18px; flex: none; }
.nav-link:hover, .nav-link[aria-current="page"] { background: var(--surface-2); color: var(--ink); }
.demo-note { margin-top: 10px; padding: 0 14px; color: var(--muted); font-size: var(--fs-xs); line-height: 1.45; }
.demo-tag {
  display: inline-block;
  margin-right: 4px;
  padding: 1px 8px;
  border-radius: var(--pill);
  background: var(--gold-soft);
  color: var(--gold);
  font-weight: 700;
}

@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); }
  .topbar, .drawer-scrim { display: none; }
  .nav {
    position: sticky;
    top: 0;
    height: 100vh;
    width: auto;
    transform: none;
    visibility: visible;
    transition: none;
    background: rgba(11, 11, 12, .55);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding-top: 36px;
    box-shadow: none;
  }
  .nav.open { box-shadow: none; }
  .main-in {
    --gl: 64px;
    --gr: max(32px, env(safe-area-inset-right, 0px));
    padding-left: 64px;
    padding-right: max(32px, env(safe-area-inset-right, 0px));
    padding-block: 56px 80px;
  }
  body.has-cart .main-in { padding-bottom: 140px; }
}

/* ---------- tipografía y bloques ---------- */
.view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.view.narrow { max-width: 440px; }
.head { display: grid; gap: 10px; }
.head-row { grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 12px; }
.h1 {
  font-family: var(--display);
  font-size: 1.75rem;
  line-height: 1.12;
  font-weight: 500;
  letter-spacing: .05em;
  text-transform: uppercase;
  text-wrap: balance;
}
.h2 { font-family: var(--display); font-size: 1.25rem; line-height: 1.25; font-weight: 700; letter-spacing: .01em; text-wrap: balance; }
.h3 { font-size: var(--fs-md); font-weight: 800; }
.lead { color: var(--muted); font-size: var(--fs-lg); line-height: 1.5; max-width: 60ch; text-wrap: pretty; }
.meta { color: var(--muted); font-size: var(--fs-sm); }
.small { font-size: var(--fs-xs); }
.note { padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); font-size: var(--fs-sm); }
.opt { color: var(--muted); font-weight: 500; }
.stack { display: grid; gap: 16px; min-width: 0; }
.empty {
  display: grid; gap: 14px; justify-items: start;
  padding: 22px;
  border-radius: var(--r-lg);
  background: var(--surface);
  color: var(--muted);
}
.link { color: var(--gold); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.ref { color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; }
.sel { user-select: all; -webkit-user-select: all; }
.price-line { margin-top: 4px; }
.price-tag {
  display: inline-block;
  padding: 6px 14px;
  border-radius: var(--pill);
  background: var(--gold-soft);
  color: var(--gold);
  font-weight: 700;
  font-size: var(--fs-sm);
  font-variant-numeric: tabular-nums;
}
@media (min-width: 900px) { .h1 { font-size: 2.25rem; } }

/* ---------- botones y formularios ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px;
  padding: 0 24px;
  border: 1px solid transparent;
  border-radius: var(--pill);
  font-weight: 750;
  font-size: 1rem;
  line-height: 1.2;
  text-decoration: none;
  cursor: pointer;
  transition: background-color .15s, border-color .15s, color .15s, transform .1s;
}
.btn:active { transform: scale(.98); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-primary { background: var(--gold) var(--gold-grad); color: var(--gold-ink); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25); }
.btn-primary:hover { background: var(--gold-hi); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { border-color: var(--gold); color: var(--gold); }
.btn-block { width: 100%; }
.btn-sm { min-height: 40px; padding: 0 16px; font-size: var(--fs-sm); }
.btn-danger { background: var(--bad); color: var(--gold-ink); }
.btn-quiet-danger { color: var(--bad); }
.btn-quiet-danger:hover { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .5; cursor: progress; }
.form { display: grid; gap: 18px; }
.field { display: grid; gap: 8px; }
.field label, .label { font-weight: 700; font-size: var(--fs-sm); }
.hint { color: var(--muted); font-size: var(--fs-xs); }
.input {
  width: 100%;
  min-height: 52px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-2);
  color: var(--ink);
  font-size: 1rem;
  -webkit-appearance: none;
  appearance: none;
}
.input::placeholder { color: var(--muted); opacity: .85; }
textarea.input { min-height: 96px; resize: vertical; line-height: 1.45; }
.input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-ring); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.input-sm { min-height: 42px; padding: 8px 16px; border-radius: var(--pill); font-size: var(--fs-sm); }
.select {
  width: auto;
  padding-right: 38px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 20px) 52%, calc(100% - 15px) 52%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  font-weight: 700;
}
input[type="search"].input { -webkit-appearance: none; }
.check {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
  color: var(--muted);
  font-size: var(--fs-sm);
  cursor: pointer;
}
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--gold); }
.err { color: var(--bad); font-size: var(--fs-sm); font-weight: 700; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

/* ---------- inicio ---------- */
.home { gap: 18px; }
/* portada: logotipo con un halo dorado, lema del club y accesos directos */
.hero {
  display: grid;
  justify-items: center;
  gap: 22px;
  padding-block: 18px 14px;
  text-align: center;
  background: radial-gradient(closest-side, rgba(228, 191, 68, .15), rgba(228, 191, 68, 0)) 50% 0 / min(100%, 520px) 300px no-repeat;
}
.hero-logo { display: block; width: min(100%, 320px); }
.hero-logo .logo { width: 100%; height: auto; filter: drop-shadow(0 0 18px rgba(228, 191, 68, .22)); }
.motto { display: grid; justify-items: center; gap: 6px; max-width: 34em; }
.motto::before {
  content: "";
  width: 120px;
  height: 1px;
  margin-bottom: 10px;
  background: linear-gradient(90deg, rgba(227, 194, 90, 0), var(--gold), rgba(227, 194, 90, 0));
}
.motto-1 {
  color: var(--gold);
  font-family: var(--display);
  font-size: .8125rem;
  font-weight: 500;
  line-height: 1.6;
  letter-spacing: .24em;
  text-transform: uppercase;
  text-wrap: balance;
}
.motto-2 { font-size: .9375rem; font-weight: 600; line-height: 1.45; text-wrap: balance; }
.motto-3 { color: var(--muted); font-size: var(--fs-xs); font-weight: 500; text-wrap: balance; }
/* los dos botones principales (reservar clase y pedir ropa), debajo de Nuestra historia */
.home-ctas { display: grid; gap: 10px; }
.home-ctas .btn-cta:nth-child(2)::after { animation-delay: 3.25s; }   /* el destello pasa por uno y luego por el otro */
@media (min-width: 520px) { .home-ctas { grid-template-columns: minmax(0, 420px); justify-content: center; } .home-ctas .btn-cta { min-width: 0; } }
/* botón principal de la portada: oro metálico, halo y un destello que lo cruza cada pocos segundos */
.btn-cta {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  min-height: 62px;
  padding: 0 20px;
  gap: 10px;
  border-color: rgba(255, 240, 190, .6);
  font-family: var(--display);
  font-size: .9375rem;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  white-space: nowrap;
  background: linear-gradient(115deg, #B68E38 0%, #E2BE4C 22%, #F6E3A6 48%, #E2BE4C 72%, #B38A33 100%);
  box-shadow: 0 0 0 4px rgba(227, 194, 90, .12), 0 14px 36px rgba(227, 194, 90, .32), inset 0 1px 0 rgba(255, 255, 255, .55);
  transition: box-shadow .2s, transform .1s;
}
.btn-cta::after {
  content: "";
  position: absolute;
  z-index: -1;
  top: 0;
  bottom: 0;
  left: 0;
  width: 38%;
  background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .7), rgba(255, 255, 255, 0));
  transform: translateX(-160%) skewX(-18deg);
  animation: destello 4.5s ease-in-out 1s infinite;
  pointer-events: none;
}
@keyframes destello { 0% { transform: translateX(-160%) skewX(-18deg); } 38%, 100% { transform: translateX(380%) skewX(-18deg); } }
.btn-cta:hover { background: linear-gradient(115deg, #C29A40 0%, #E8C658 22%, #FAEBBB 48%, #E8C658 72%, #BE953B 100%); box-shadow: 0 0 0 5px rgba(227, 194, 90, .18), 0 16px 42px rgba(227, 194, 90, .42), inset 0 1px 0 rgba(255, 255, 255, .6); }
.btn-cta svg { width: 20px; height: 20px; }
@media (max-width: 380px) { .btn-cta svg:first-child { display: none; } }
@media (max-width: 340px) { .btn-cta { white-space: normal; } }
@media (min-width: 520px) { .btn-cta { min-width: 380px; padding: 0 26px; gap: 12px; font-size: 1rem; letter-spacing: .08em; } }
@media (min-width: 900px) {
  .hero { padding-top: 8px; }
  .hero-logo { width: 380px; }
}
.home-grid { display: grid; gap: 12px; }
@media (min-width: 700px) {
  .home-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  /* la primera tarjeta va a lo ancho; si la última se queda sola en su fila, también */
  .home-grid > :last-child:nth-child(odd) { grid-column: 1 / -1; }   /* si la última se queda sola en su fila, a lo ancho */
}
/* tarjetas del inicio: alternan negro y oro, las dos con textura de metal cepillado */
.home-block {
  display: grid;
  gap: 12px;
  align-content: start;
  min-width: 0;
  padding: 24px;
  border: 1px solid rgba(227, 194, 90, .24);
  border-radius: var(--r-lg);
  background: var(--fondo-negro);
}
.home-block .h2 { color: var(--gold); }
.home-block p { max-width: 60ch; font-size: .875rem; line-height: 1.6; letter-spacing: -.005em; text-align: justify; -webkit-hyphens: manual; hyphens: manual; overflow-wrap: normal; word-break: normal; }   /* justificado, pero sin partir palabras con guion */

.block-txt { display: grid; gap: 12px; align-content: start; min-width: 0; }
/* tarjeta con foto (Nuestra historia): la foto arriba en el móvil y a la derecha en pantallas anchas */
.home-block.con-foto { gap: 0; padding: 0; overflow: hidden; }
.con-foto .block-txt { position: relative; gap: 8px; margin-top: -34px; padding: 0 22px 20px; }
.block-foto { position: relative; margin: 0; aspect-ratio: 16 / 9; }
/* la foto se funde con la tarjeta: se desvanece hacia abajo hasta llegar a las personas */
.block-foto img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 18%;
  -webkit-mask-image: linear-gradient(180deg, #000 55%, rgba(0, 0, 0, .75) 68%, rgba(0, 0, 0, .3) 83%, rgba(0, 0, 0, 0) 96%);

}
/* y se difumina poco a poco en la parte de abajo */
.block-foto::after {
  content: "";
  position: absolute;
  inset: 58% 0 0;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0), #000 75%);
  mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0), #000 75%);
  pointer-events: none;
}
@media (min-width: 700px) {

  .con-foto .block-foto img {

    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0), #000 38%), linear-gradient(180deg, #000 50%, rgba(0, 0, 0, .3) 78%, rgba(0, 0, 0, 0) 93%);

}

/* ---------- clases particulares ---------- */

/* tarifas: clase suelta (negra) y bono (dorada) */

/* ---------- hoja inferior (diálogos) ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 60; display: grid; align-items: end; }

.gal-nav, .visor-nav {
  position: absolute; top: 50%;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: rgba(255, 255, 255, .92);
  color: #0B0B0C;
  box-shadow: 0 2px 12px rgba(0, 0, 0, .14);
  transform: translateY(-50%);
  cursor: pointer;
}
.gal-nav svg, .visor-nav svg { width: 18px; height: 18px; }
.gal-nav.ant { left: 10px; }
.gal-nav.sig { right: 10px; }
.gal-dots { position: absolute; left: 0; right: 0; bottom: 12px; }
.gal-nav:focus-visible, .visor-nav:focus-visible, .gal-item:focus-visible { outline: 2px solid #0B0B0C; outline-offset: -4px; }
/* visor a pantalla completa: deslizar entre fotos, tocar para ampliar y mover con el dedo */
.visor {
  position: fixed; inset: 0; z-index: 90;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  background: var(--tile);
  color: #0B0B0C;
  animation: aparece .2s ease;
}
.visor-track { display: flex; min-height: 0; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior: contain; padding-top: env(safe-area-inset-top, 0px); }
.visor-track::-webkit-scrollbar { display: none; }
.visor.zoomed .visor-track { overflow: hidden; }
.visor-item { flex: 0 0 100%; min-width: 0; display: grid; place-items: center; overflow: hidden; scroll-snap-align: center; }
.visor-item img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
.visor-item.zoom { place-items: start; overflow: auto; overscroll-behavior: contain; }
.visor-item.zoom img { width: 250%; max-width: none; max-height: none; cursor: zoom-out; }
.visor-x {
  position: absolute; z-index: 1;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  right: max(12px, env(safe-area-inset-right, 0px));
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: #0B0B0C; color: #fff;
  cursor: pointer;
}
.visor-x svg { width: 20px; height: 20px; }
.visor-nav { width: 44px; height: 44px; }
.visor-nav.ant { left: max(12px, env(safe-area-inset-left, 0px)); }
.visor-nav.sig { right: max(12px, env(safe-area-inset-right, 0px)); }
.visor.zoomed .visor-nav { display: none; }
.visor-pie { padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); color: rgba(11, 11, 12, .62); font-size: var(--fs-sm); font-weight: 600; text-align: center; }
/* carteles: fondo negro */
.visor.oscuro { background: #050506; color: var(--ink); }
.visor.oscuro .visor-x { background: var(--surface-3); color: var(--gold); }
.visor.oscuro .visor-pie { color: var(--muted); }
.sizes { display: flex; flex-wrap: wrap; gap: 8px; }
.size {
  min-width: 52px;
  height: 44px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: var(--pill);
  background: var(--surface-2);
  color: var(--ink);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.size:hover { border-color: var(--gold); }
.size[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.stepper {
  display: inline-grid;
  grid-template-columns: 46px 44px 46px;
  align-items: center;
  justify-self: start;
  border: 1px solid var(--line);
  border-radius: var(--pill);
  background: var(--surface-2);
}
.stepper button { height: 46px; border: 0; border-radius: var(--pill); background: transparent; color: var(--ink); font-size: 1.3rem; line-height: 1; cursor: pointer; }
.stepper button:hover { color: var(--gold); }
.stepper output { text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.stepper-sm { grid-template-columns: 38px 30px 38px; }
.stepper-sm button { height: 38px; font-size: 1.1rem; }
.cartbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  background: var(--bar);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-top: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.cart-in { display: flex; align-items: center; gap: 12px; max-width: 760px; }
.cart-info { display: grid; min-width: 0; line-height: 1.3; }
.cart-info b { font-weight: 800; font-variant-numeric: tabular-nums; }
.cart-info span { color: var(--muted); font-variant-numeric: tabular-nums; }
.cart-in .btn { margin-left: auto; }
@media (min-width: 900px) { .cartbar { left: var(--nav-w); padding-left: 64px; } }
.lines { display: grid; padding: 0 16px; border-radius: var(--r-lg); background: var(--surface-2); }
.line {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px 12px;
  align-items: center;
  padding-block: 14px;
  border-bottom: 1px solid var(--line);
}
.line:last-child { border-bottom: 0; }
.line-main { display: grid; gap: 2px; min-width: 0; }
.line-name { font-weight: 700; }
.line-meta { color: var(--muted); font-size: var(--fs-sm); }
.line-total { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.line .stepper { grid-column: 1; background: var(--surface); }
.total-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding-block: 12px;
  font-size: var(--fs-lg);
  font-variant-numeric: tabular-nums;
}
.total-row b { color: var(--gold); font-weight: 800; }
.total-sm { font-size: var(--fs-md); padding-block: 6px; }
.order-lines { display: grid; gap: 6px; font-size: var(--fs-sm); }
.order-lines li { display: flex; justify-content: space-between; gap: 12px; }
.order-lines li span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- horarios de entrenamiento ---------- */
.hor-chips { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.hor-wrap { position: relative; }
.hor-wrap.hay-mas::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 44px; background: linear-gradient(90deg, rgba(11, 11, 12, 0), var(--bg) 85%); pointer-events: none; }
.hor-chips::-webkit-scrollbar { display: none; }
.hor-chip {
  flex: none;
  min-height: 42px;
  padding: 0 10px;
  border: 1px solid rgba(227, 194, 90, .35);
  border-radius: var(--pill);
  background: #0E0E0F;
  color: var(--gold);
  font-family: var(--display);
  font-size: .8125rem;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
}
.hor-chip:hover { border-color: var(--gold); }
.hor-chip[aria-pressed="true"] {
  border-color: transparent;
  background: linear-gradient(115deg, #B68E38 0%, #E2BE4C 22%, #F6E3A6 48%, #E2BE4C 72%, #B38A33 100%);
  color: #0B0B0C;
  box-shadow: 0 6px 18px rgba(227, 194, 90, .22), inset 0 1px 0 rgba(255, 255, 255, .5);
}
/* semana: un círculo por día; en dorado los días con entrenamiento */
.semana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.semana li { display: grid; place-items: center; }
.sem-dia {
  width: 100%;
  max-width: 46px;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: transparent;
  color: var(--muted);
  font-family: var(--display);
  font-size: .9375rem;
  font-weight: 600;
}
.sem-dia:disabled { opacity: .4; }
.sem-dia.on { border-color: rgba(227, 194, 90, .55); background: var(--gold-soft); color: var(--gold); cursor: pointer; }
.sem-dia.on:hover { border-color: var(--gold); }
.sem-dia.es-hoy { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--gold); }
.sem-dia.on.es-hoy { border-color: transparent; background: var(--fondo-oro); color: #0B0B0C; }
.dias { display: grid; gap: 14px; }
.dias.entra { animation: aparece .25s ease; }
@media (min-width: 900px) { .dias { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }
/* tarjeta de cada día: negra; la de hoy, dorada */
.dia-card {
  --tx: var(--ink);
  --tx2: var(--muted);
  --acento: var(--gold);
  --raya: rgba(227, 194, 90, .18);
  padding: 18px 18px 6px;
  border: 1px solid rgba(227, 194, 90, .24);
  border-radius: var(--r-lg);
  background: var(--fondo-negro);
  color: var(--tx);
  scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--top-h) + 80px);
}
.dia-card.hoy {
  --tx: #14110A;
  --tx2: rgba(20, 17, 10, .7);
  --acento: #14110A;
  --raya: rgba(20, 17, 10, .2);
  border-color: rgba(255, 238, 180, .55);
  background: var(--fondo-oro);
  box-shadow: 0 18px 44px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .4);
}
.dia-head { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--raya); }
.dia-nombre { color: var(--acento); font-family: var(--display); font-size: 1.25rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.dia-hoy { padding: 3px 10px; border-radius: var(--pill); background: #0B0B0C; color: var(--gold); font-size: .6875rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.dia-rango { margin-left: auto; color: var(--tx2); font-size: var(--fs-sm); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sesion { display: grid; grid-template-columns: 54px minmax(0, 1fr) 40px; gap: 12px; align-items: start; padding: 14px 0; }
.sesion + .sesion { border-top: 1px dashed var(--raya); }
.ses-hora { display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
.ses-hora b { font-family: var(--display); font-size: 1.25rem; font-weight: 600; line-height: 1.1; }
.ses-hora span:last-child { color: var(--tx2); font-size: var(--fs-sm); font-weight: 600; }
.ses-info { position: relative; display: grid; gap: 4px; min-width: 0; padding-left: 14px; border-left: 2px solid var(--raya); }
.ses-info::before { content: ""; position: absolute; top: 5px; left: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--acento); }
.ses-tipo { color: var(--acento); font-family: var(--display); font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.ses-grupo { font-family: var(--display); font-size: 1.0625rem; font-weight: 700; line-height: 1.25; }
.ses-grupos { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 2px; }
.ses-grupos li { padding: 3px 10px; border: 1px solid var(--raya); border-radius: var(--pill); font-size: var(--fs-sm); font-weight: 700; }
.ses-dur { color: var(--tx2); font-size: var(--fs-xs); font-weight: 600; }
.ses-ico { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; }
.ses-ico svg { width: 20px; height: 20px; }
.t-competicion .ses-ico, .t-baile .ses-ico { background: var(--fondo-oro); color: #0B0B0C; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45); }
.t-recreativo .ses-ico { border: 1.5px solid var(--acento); color: var(--acento); }
.dia-card.hoy .t-competicion .ses-ico, .dia-card.hoy .t-baile .ses-ico { background: #14110A; color: var(--gold); box-shadow: none; }

/* ---------- nuestra historia ---------- */
.link-mas { justify-self: start; display: inline-flex; align-items: center; gap: 8px; margin-top: 2px; padding: 0; border: 0; background: none; color: var(--gold); font-family: var(--display); font-size: .8125rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
.link-mas svg { width: 16px; height: 16px; transition: transform .2s; }
.link-mas:hover svg { transform: translateX(3px); }
/* portada: la foto del equipo con la frase encima, fundida en negro */
.his-portada { position: relative; overflow: hidden; display: grid; border: 1px solid rgba(227, 194, 90, .3); border-radius: var(--r-lg); background: var(--fondo-negro); }
.his-portada img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; object-position: 50% 15%; -webkit-mask-image: linear-gradient(180deg, #000 62%, transparent); mask-image: linear-gradient(180deg, #000 62%, transparent); }
.his-portada-txt { position: relative; display: grid; gap: 8px; margin-top: -36px; padding: 0 20px 22px; }
.his-portada.sin-foto .his-portada-txt { margin-top: 0; padding-top: 22px; }
.his-kicker { color: var(--gold); font-family: var(--display); font-size: .75rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.his-frase { font-family: var(--display); font-size: 1.375rem; font-weight: 600; line-height: 1.25; text-wrap: balance; }
@media (min-width: 700px) { .his-frase { font-size: 1.875rem; } .his-portada-txt { padding: 0 28px 28px; } }
.his-textos { display: grid; gap: 12px; }
.his-textos p { max-width: 62ch; color: rgba(244, 241, 234, .86); font-size: .9375rem; line-height: 1.65; }
/* entrenadores: dos tarjetas con su inicial (o foto) en un anillo dorado */
.his-ents { display: grid; gap: 14px; }
.his-ents .h2 { color: var(--gold); }
.ents { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ent { display: grid; justify-items: center; align-content: start; gap: 4px; padding: 20px 14px 18px; border: 1px solid rgba(227, 194, 90, .3); border-radius: var(--r-lg); background: var(--fondo-negro); text-align: center; }
.ent-foto { display: grid; place-items: center; width: 120px; height: 120px; margin-bottom: 8px; padding: 3px; border-radius: 50%; background: conic-gradient(from 200deg, #B08732, #F0DA98, #E3C25A, #B08732, #F6E3A6, #C29B37, #B08732); }
.ent-foto > * { display: grid; place-items: center; width: 100%; height: 100%; border: 2px solid #0E0E0F; border-radius: 50%; background: #0B0B0C; object-fit: cover; }
.ent-foto span { color: var(--gold); font-family: var(--display); font-size: 1.75rem; font-weight: 600; letter-spacing: .04em; }
.ent-rol { color: var(--gold); font-family: var(--display); font-size: .6875rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.ent-nombre { font-family: var(--display); font-size: 1.25rem; font-weight: 700; line-height: 1.2; }
.ent-txt { display: grid; gap: 8px; color: var(--muted); font-size: var(--fs-sm); line-height: 1.5; }
.ent-txt p:last-child:not(:first-child) { color: var(--gold-hi); font-style: italic; }
@media (max-width: 560px) { .ents { grid-template-columns: minmax(0, 1fr); } }
/* cifras: los números grandes del club */
.his-cifras { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.his-cifra { display: grid; align-content: start; gap: 4px; padding: 18px 16px; border: 1px solid rgba(227, 194, 90, .3); border-radius: var(--r-lg); background: var(--fondo-negro); }
.his-cifra:nth-child(even) { border-color: rgba(255, 238, 180, .55); background: var(--fondo-oro); color: #14110A; }
.his-num { color: var(--gold); font-family: var(--display); font-size: 2.75rem; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
.his-cifra:nth-child(even) .his-num { color: #14110A; }
.his-num-t { font-size: var(--fs-sm); font-weight: 700; line-height: 1.35; }
/* filosofía: los cuatro valores numerados */
.his-filo { display: grid; gap: 14px; }
.his-filo .h2 { color: var(--gold); }
.his-filo > p { max-width: 62ch; color: rgba(244, 241, 234, .86); font-size: .9375rem; line-height: 1.65; }
.his-valores { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.his-valores li { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 10px 14px; border: 1px solid rgba(227, 194, 90, .3); border-radius: var(--r-md); background: var(--fondo-negro); font-family: var(--display); font-weight: 700; line-height: 1.2; }
.his-valores span { color: var(--gold); font-size: .8125rem; font-weight: 600; letter-spacing: .06em; }
@media (min-width: 700px) { .his-valores { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
/* cierre: tarjeta dorada con la frase final */
.his-cierre { display: grid; gap: 12px; padding: 24px 22px; border: 1px solid rgba(255, 238, 180, .55); border-radius: var(--r-lg); background: var(--fondo-oro); color: #14110A; box-shadow: 0 18px 44px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .4); }
.his-cierre .his-kicker { color: rgba(20, 17, 10, .7); }
.his-cierre-t { font-family: var(--display); font-size: 1.625rem; font-weight: 700; line-height: 1.15; text-transform: uppercase; letter-spacing: .03em; }
.his-cierre p { font-size: .9375rem; line-height: 1.6; }
.his-quote { margin: 6px 0 0; padding: 14px 0 0 16px; border-top: 1px solid rgba(20, 17, 10, .2); border-left: 3px solid #14110A; font-family: var(--display); font-size: 1.1875rem; font-weight: 600; line-height: 1.35; }
/* logros: tarjetas que alternan negro y oro, con su icono */
.his-logros { display: grid; gap: 12px; }
@media (min-width: 700px) { .his-logros { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); } }
.his-logro { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 14px; row-gap: 2px; align-items: center; padding: 16px; border: 1px solid rgba(227, 194, 90, .24); border-radius: var(--r-lg); background: var(--fondo-negro); }
.his-logro:nth-child(even) { border-color: rgba(255, 238, 180, .55); background: var(--fondo-oro); color: #14110A; }
.his-ico { grid-row: span 2; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--fondo-oro); color: #14110A; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45); }
.his-logro:nth-child(even) .his-ico { background: #14110A; color: var(--gold); box-shadow: none; }
.his-ico svg { width: 23px; height: 23px; }
.his-logro-t { align-self: end; font-family: var(--display); font-size: 1.125rem; font-weight: 700; line-height: 1.2; }
.his-logro:nth-child(odd) .his-logro-t { color: var(--gold); }
.his-logro-x { align-self: start; font-size: var(--fs-sm); line-height: 1.45; opacity: .85; }
/* momentos clave: línea dorada con el año de cada hito */
.his-linea { display: grid; gap: 16px; }
.his-linea .h2 { color: var(--gold); }
.his-linea ol { position: relative; display: grid; gap: 14px; margin: 0; padding: 0 0 0 4px; list-style: none; }
.his-linea ol::before { content: ""; position: absolute; top: 10px; bottom: 10px; left: 37px; width: 2px; background: linear-gradient(180deg, var(--gold), rgba(227, 194, 90, .15)); }
.his-hito { position: relative; display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 14px; align-items: start; }
.his-anio { position: relative; z-index: 1; display: grid; place-items: center; height: 34px; border-radius: var(--pill); background: var(--fondo-oro); color: #14110A; font-family: var(--display); font-size: 1rem; font-weight: 700; box-shadow: 0 0 0 4px var(--bg); }
.his-hito-c { display: grid; gap: 4px; padding: 14px 16px; border: 1px solid rgba(227, 194, 90, .24); border-radius: var(--r-md); background: var(--fondo-negro); }
.his-hito-t { font-family: var(--display); font-size: 1.0625rem; font-weight: 700; line-height: 1.25; }
.his-hito-x { color: var(--muted); font-size: var(--fs-sm); line-height: 1.5; }
.his-anio.largo { font-size: .8125rem; letter-spacing: -.01em; }
.his-hito.futuro .his-anio { border: 2px solid var(--gold); background: #14110A; color: var(--gold); }
.his-hito.futuro .his-hito-c { border-style: dashed; border-color: rgba(227, 194, 90, .55); }
.his-prox { justify-self: start; margin-top: 4px; padding: 3px 10px; border-radius: var(--pill); background: var(--gold-soft); color: var(--gold); font-size: .6875rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.his-ctas { margin-top: 4px; }

/* ---------- temporada ---------- */
/* círculo dorado con el icono en negro (como los de Horarios) */
:is(.fact-ico, .equip-ico) {
  flex: none;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--fondo-oro);
  color: #14110A;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 6px 16px rgba(0, 0, 0, .3);
}
:is(.fact-ico, .equip-ico) svg { width: 22px; height: 22px; }
/* aviso puntual (si el club añade uno): barra dorada a la izquierda */
.notice {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr);
  gap: 14px;
  align-items: start;
  padding: 18px;
  border: 1px solid rgba(227, 194, 90, .35);
  border-left: 4px solid var(--gold);
  border-radius: var(--r-lg);
  background: var(--fondo-negro);
}
.notice svg { width: 40px; height: 40px; padding: 9px; border-radius: 50%; background: var(--gold-soft); color: var(--gold); }
.notice-title { color: var(--gold); font-family: var(--display); font-size: 1.0625rem; font-weight: 700; }

/* la temporada de un vistazo: tarjeta de oro con las fechas y la barra de avance */
.curso {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: grid;
  gap: 16px;
  padding: 20px 20px 18px;
  border: 1px solid rgba(255, 238, 180, .55);
  border-radius: var(--r-lg);
  background: var(--fondo-oro);
  color: #14110A;
  box-shadow: 0 18px 44px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .4);
}
.curso-marca { position: absolute; z-index: -1; top: -14px; right: -46px; width: 250px; height: auto; fill: rgba(20, 17, 10, .07); }
.curso-estado {
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 5px 10px;
  border-radius: var(--pill);
  background: #14110A;
  color: var(--gold);
  font-family: var(--display);
  font-size: .75rem;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.curso-estado::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.curso-estado.en-curso::before { animation: latido 2.2s ease-out infinite; }
@keyframes latido { 0% { box-shadow: 0 0 0 0 rgba(227, 194, 90, .7); } 70%, 100% { box-shadow: 0 0 0 7px rgba(227, 194, 90, 0); } }
.curso-fechas { display: flex; justify-content: space-between; gap: 12px; }
.curso-fechas p { display: grid; }
.curso-fechas .fin { text-align: right; }
.curso-fechas span { display: inline-flex; align-items: center; gap: 6px; color: rgba(20, 17, 10, .66); font-family: var(--display); font-size: .75rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.curso-fechas .fin span { justify-content: flex-end; }
.curso-fechas span svg { width: 15px; height: 15px; }
.curso-fechas b { margin-top: 2px; font-family: var(--display); font-size: 2.125rem; font-weight: 600; line-height: 1; letter-spacing: -.01em; }
.curso-fechas small { font-size: var(--fs-sm); font-weight: 700; color: rgba(20, 17, 10, .7); }
.curso-barra { position: relative; height: 10px; margin: 4px 11px; border-radius: var(--pill); background: rgba(20, 17, 10, .16); box-shadow: inset 0 1px 2px rgba(20, 17, 10, .22); }
.curso-barra i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: #14110A; }
.curso-barra span { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 3px solid #14110A; border-radius: 50%; background: var(--gold-hi); box-shadow: 0 2px 8px rgba(20, 17, 10, .35); }
.curso-nota { color: rgba(20, 17, 10, .78); font-size: var(--fs-sm); font-weight: 600; }
.curso-nota b { color: #14110A; font-weight: 800; }

/* cifras clave (cuota, licencia…): negras con el icono en oro */
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fact {
  display: grid;
  gap: 4px;
  align-content: start;
  min-width: 0;
  padding: 16px;
  border: 1px solid rgba(227, 194, 90, .24);
  border-radius: var(--r-lg);
  background: var(--fondo-negro);
}
.fact-ico { margin-bottom: 10px; }
.fact-et { color: var(--gold); font-family: var(--display); font-size: .75rem; font-weight: 600; letter-spacing: .09em; line-height: 1.35; text-transform: uppercase; }
.fact-val { font-family: var(--display); font-size: 1.375rem; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
@media (max-width: 699px) { .fact:last-child:nth-child(odd) { grid-column: 1 / -1; } }
.fact:only-child, .fact:last-child:nth-child(odd) { grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 14px; row-gap: 2px; }
.fact:only-child .fact-ico, .fact:last-child:nth-child(odd) .fact-ico { grid-row: span 2; margin-bottom: 0; }
@media (min-width: 700px) { .fact:last-child:nth-child(odd):not(:only-child) { grid-template-columns: none; } .fact:last-child:nth-child(odd):not(:only-child) .fact-ico { grid-row: auto; margin-bottom: 10px; } }
@media (max-width: 380px) { .fact { padding: 14px; } .fact-val { font-size: 1.125rem; } }
@media (min-width: 700px) { .facts { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); } }

/* equipación de competición: las prendas en una tira que se desliza */
.equip {
  display: grid;
  gap: 14px;
  min-width: 0;
  padding: 20px;
  border: 1px solid rgba(227, 194, 90, .24);
  border-radius: var(--r-lg);
  background: var(--fondo-negro);
  overflow: hidden;
}
.equip-head { display: flex; align-items: center; gap: 12px; }
.equip .h2 { color: var(--gold); font-size: 1.3125rem; line-height: 1.2; }
.equip .h2 .marca { color: var(--gold-hi); }
.equip-txt { color: rgba(244, 241, 234, .82); line-height: 1.55; }
.equip-tira { display: flex; gap: 10px; margin: 0 -20px; padding: 2px 20px 4px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 20px; scrollbar-width: none; overscroll-behavior-x: contain; }
.equip-tira::-webkit-scrollbar { display: none; }
.equip-tira li { flex: none; width: 124px; scroll-snap-align: start; }
.equip-prenda { display: grid; gap: 6px; width: 100%; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.equip-foto { display: grid; place-items: center; aspect-ratio: 1; overflow: hidden; border: 1px solid rgba(227, 194, 90, .18); border-radius: var(--r-md); background: var(--surface-2); color: var(--gold); }
.equip-foto.foto { background: var(--tile); }
.equip-foto img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .3s ease; }
.equip-foto svg { width: 64%; height: 64%; }
.equip-prenda:hover .equip-foto img { transform: scale(1.05); }
.equip-prenda:focus-visible { outline: none; }
.equip-prenda:focus-visible .equip-foto { outline: 2px solid var(--gold); outline-offset: 2px; }
.equip-nombre { font-size: var(--fs-sm); font-weight: 700; line-height: 1.25; }
.equip-precio { color: var(--gold); font-family: var(--display); font-size: .9375rem; font-weight: 600; }
.equip-precio.pend { color: var(--muted); font-family: var(--font); font-size: var(--fs-xs); }
.equip-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 52px;
  padding: 0 18px;
  border: 1px solid rgba(255, 240, 190, .6);
  border-radius: var(--pill);
  background: linear-gradient(115deg, #B68E38 0%, #E2BE4C 22%, #F6E3A6 48%, #E2BE4C 72%, #B38A33 100%);
  box-shadow: 0 10px 26px rgba(227, 194, 90, .2), inset 0 1px 0 rgba(255, 255, 255, .55);
  color: #14110A;
  font-family: var(--display);
  font-size: .9375rem;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: box-shadow .2s, transform .1s;
}
.equip-btn svg { width: 20px; height: 20px; }
@media (max-width: 380px) { .equip-btn { white-space: nowrap; } .equip-btn svg:first-child { display: none; } }
.equip-btn:hover { box-shadow: 0 14px 34px rgba(227, 194, 90, .32), inset 0 1px 0 rgba(255, 255, 255, .6); }
.equip-btn:active { transform: scale(.98); }

/* informaciones adicionales: tarjeta de oro, una fila por punto con su icono */
.info-club {
  display: grid;
  gap: 4px;
  padding: 20px 20px 6px;
  border: 1px solid rgba(255, 238, 180, .55);
  border-radius: var(--r-lg);
  background: var(--fondo-oro);
  color: #14110A;
  box-shadow: 0 18px 44px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .4);
}
.info-head { display: flex; align-items: center; gap: 12px; padding-bottom: 8px; }
.info-ico { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: #14110A; color: var(--gold); }
.info-ico svg { width: 22px; height: 22px; }
.info-kicker { color: rgba(20, 17, 10, .66); font-family: var(--display); font-size: .75rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.info-club .h2 { color: #14110A; font-size: 1.3125rem; }
.info-lista li + li { border-top: 1px solid rgba(20, 17, 10, .16); }
.info-item { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 14px 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; }
button.info-item { cursor: pointer; }
.info-i { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: #14110A; color: var(--gold); }
.info-i svg { width: 20px; height: 20px; }
.info-txt { display: grid; gap: 2px; min-width: 0; }
.info-txt b { font-family: var(--display); font-size: 1.0625rem; font-weight: 700; line-height: 1.25; }
.info-txt span { color: rgba(20, 17, 10, .8); font-size: var(--fs-sm); line-height: 1.5; }
.info-txt .link { color: #14110A; }
.info-ir { display: grid; place-items: center; width: 32px; height: 32px; border: 1.5px solid rgba(20, 17, 10, .38); border-radius: 50%; transition: background-color .15s, color .15s, border-color .15s; }
.info-ir svg { width: 16px; height: 16px; }
button.info-item:hover .info-ir { border-color: #14110A; background: #14110A; color: var(--gold); }
.info-club :focus-visible { outline-color: #14110A; }

/* bloques de texto (filas Sección), por si el club añade alguno */
.prose { display: grid; gap: 12px; }
.prose section { display: grid; gap: 8px; }
.view .prose section { padding: 20px; border: 1px solid rgba(227, 194, 90, .24); border-radius: var(--r-lg); background: var(--fondo-negro); }
.prose .h2 { color: var(--gold); }
.prose p { max-width: 65ch; line-height: 1.6; }
/* tarjeta de Instagram: la cuenta con el logo en un anillo dorado, una fila de fotos del feed y el botón de oro */
.insta {
  display: grid;
  gap: 14px;
  padding: 16px;
  border: 1px solid rgba(227, 194, 90, .24);
  border-radius: var(--r-lg);
  background: var(--fondo-negro);
  color: var(--ink);
  text-decoration: none;
  transition: border-color .2s, transform .1s;
}
.insta:hover { border-color: rgba(227, 194, 90, .55); }
.insta:active { transform: scale(.99); }
.insta:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.insta-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
.insta-avatar {
  flex: none;
  width: 56px;
  height: 56px;
  padding: 2px;
  border-radius: 50%;
  background: conic-gradient(from 200deg, #B08732, #F0DA98, #E3C25A, #B08732, #F6E3A6, #C29B37, #B08732);
}
.insta-avatar svg { display: block; width: 100%; height: 100%; padding: 11px 6px 9px; border: 2px solid #0E0E0F; border-radius: 50%; background: #0B0B0C; }
.insta-quien { display: grid; gap: 1px; min-width: 0; }
.insta-quien b { overflow: hidden; font-family: var(--display); font-size: 1.0625rem; font-weight: 700; letter-spacing: .01em; text-overflow: ellipsis; white-space: nowrap; }
.insta-quien span { color: var(--muted); font-size: var(--fs-sm); font-weight: 600; }
.insta-ext { flex: none; display: grid; place-items: center; width: 36px; height: 36px; margin-left: auto; border-radius: 50%; background: var(--gold-soft); color: var(--gold); }
.insta-ext svg { width: 18px; height: 18px; }
.insta-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; overflow: hidden; border-radius: var(--r-sm); }
.insta-grid[data-n="1"] { grid-template-columns: minmax(0, 1fr); }
.insta-grid[data-n="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.insta-grid img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 4; object-fit: cover; background: var(--surface-2); transition: filter .3s; }
.insta-grid:is([data-n="1"], [data-n="2"]) img { aspect-ratio: 1; }
.insta:hover .insta-grid img { filter: brightness(1.08) saturate(1.06); }
.insta-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 52px;
  padding: 0 18px;
  border: 1px solid rgba(255, 240, 190, .6);
  border-radius: var(--pill);
  background: linear-gradient(115deg, #B68E38 0%, #E2BE4C 22%, #F6E3A6 48%, #E2BE4C 72%, #B38A33 100%);
  box-shadow: 0 10px 26px rgba(227, 194, 90, .2), inset 0 1px 0 rgba(255, 255, 255, .55);
  color: #14110A;
  font-family: var(--display);
  font-size: .9375rem;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  transition: box-shadow .2s;
}
.insta-btn svg { width: 20px; height: 20px; }
.insta:hover .insta-btn { background: linear-gradient(115deg, #C29A40 0%, #E8C658 22%, #FAEBBB 48%, #E8C658 72%, #BE953B 100%); box-shadow: 0 14px 34px rgba(227, 194, 90, .32), inset 0 1px 0 rgba(255, 255, 255, .6); }
/* móviles estrechos: sin la flecha, para que la cuenta quepa entera */
@media (max-width: 380px) {
  .insta-ext { display: none; }
  .insta-avatar { width: 50px; height: 50px; }
  .insta-avatar svg { padding: 10px 5px 8px; }
}
/* pantallas anchas: el botón sube a la derecha de la cuenta y las fotos van debajo, a lo ancho */
@media (min-width: 700px) {
  .insta { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "head btn" "fotos fotos"; align-items: center; column-gap: 20px; row-gap: 18px; padding: 22px; }
  .insta.sin-fotos { grid-template-areas: "head btn"; }
  .insta-head { grid-area: head; }
  .insta-ext { display: none; }
  .insta-grid { grid-area: fotos; gap: 4px; }
  .insta-btn { grid-area: btn; min-width: 240px; }
}

/* ---------- competiciones ---------- */
.next {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 16px;
  align-items: center;
  padding: 18px;
  border: 1px solid var(--gold);
  border-radius: var(--r-lg);
  background: var(--fondo-negro);
}
.next-date { display: grid; justify-items: center; color: var(--gold); }
.next-num { font-family: var(--display); font-weight: 500; font-size: 2.75rem; line-height: .9; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.next-mon { font-weight: 800; font-size: var(--fs-sm); }
.next-body { display: grid; gap: 3px; min-width: 0; }
.next.varios .next-num { font-size: 2.125rem; letter-spacing: -.01em; }
.next-lugar { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); font-weight: 700; }
.next-lugar svg { flex: none; width: 16px; height: 16px; color: var(--gold); }
.dnum-rango { font-size: 1.375rem; }
.next-label { color: var(--muted); font-size: var(--fs-xs); font-weight: 700; }
.next-name { font-size: var(--fs-lg); font-weight: 800; line-height: 1.25; letter-spacing: -.01em; text-wrap: balance; }
.next .meta { font-size: var(--fs-sm); }
.next-pie { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; }
.next-ver { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px 0 9px; border: 1px solid var(--gold-ring); border-radius: var(--pill); background: transparent; color: var(--gold); font: inherit; font-size: var(--fs-xs); font-weight: 800; cursor: pointer; }
.next-ver svg { width: 15px; height: 15px; }
.next-ver:hover { border-color: var(--gold); background: var(--gold-soft); }
.countdown {
  justify-self: start;
  padding: 3px 11px;
  border-radius: var(--pill);
  background: var(--gold);
  color: var(--gold-ink);
  font-size: var(--fs-xs);
  font-weight: 800;
}
/* con cartel: el cartel arriba, de borde a borde, y los datos debajo */
.next.con-cartel { grid-template-areas: "cartel cartel" "fecha datos"; row-gap: 0; padding: 0; overflow: hidden; }
.next-cartel { grid-area: cartel; position: relative; display: block; padding: 0; border: 0; border-bottom: 1px solid rgba(227, 194, 90, .45); background: #0A1B3A; cursor: zoom-in; }
.next-cartel img { display: block; width: 100%; height: auto; aspect-ratio: 739 / 415; object-fit: cover; }
.con-cartel .next-date { grid-area: fecha; padding: 16px 0 16px 18px; }
.con-cartel .next-body { grid-area: datos; padding: 16px 18px 16px 0; }
.next-cartel:focus-visible { outline: 2px solid var(--gold); outline-offset: -4px; }
/* en pantallas anchas no se estira: el cartel se ve entero, sin recortar */
@media (min-width: 700px) { .next.con-cartel { max-width: 540px; } }
.ev-cartel { position: relative; align-self: start; width: 84px; padding: 0; overflow: hidden; border: 1px solid rgba(227, 194, 90, .3); border-radius: var(--r-sm); background: #0A1B3A; cursor: zoom-in; }
.ev-cartel img { display: block; width: 100%; aspect-ratio: 739 / 415; object-fit: cover; }
.ev:has(.ev-cartel) { grid-template-columns: 54px minmax(0, 1fr) auto; }
.ev-list { display: grid; }
.ev-month { padding: 22px 4px 10px; color: var(--muted); font-size: var(--fs-xs); font-weight: 700; }
.ev-month:first-child { padding-top: 0; }
.ev {
  display: grid;
  grid-template-columns: 54px minmax(0, 1fr);
  gap: 12px;
  padding: 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.ev-month + .ev { border-top-left-radius: var(--r-lg); border-top-right-radius: var(--r-lg); }
.ev:last-child, .ev:has(+ .ev-month) { border-bottom: 0; border-bottom-left-radius: var(--r-lg); border-bottom-right-radius: var(--r-lg); }
.ev-body { display: grid; gap: 6px; min-width: 0; }
.ev-name { font-weight: 800; line-height: 1.3; }
.ev.past { color: var(--muted); }
.ev.past .ev-name { font-weight: 700; }
.ev.past .dnum { color: var(--muted); }
.tag {
  display: inline-block;
  padding: 3px 10px;
  border: 1px solid var(--line);
  border-radius: var(--pill);
  color: var(--muted);
  font-size: var(--fs-xs);
  font-weight: 700;
}
.past-block summary { padding: 10px 4px; color: var(--muted); font-weight: 700; font-size: var(--fs-sm); cursor: pointer; }
.past-block[open] summary { margin-bottom: 8px; }

/* ---------- panel del club ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.toolbar .input { flex: 1 1 220px; }
.seg {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 2px;
  max-width: 100%;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--surface);
}
.seg button {
  min-height: 36px;
  padding: 0 14px;
  border: 0;
  border-radius: var(--pill);
  background: transparent;
  color: var(--muted);
  font-weight: 700;
  font-size: var(--fs-sm);
  cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); }
.count { margin-left: 6px; color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums; }
/* panel: Exportar y Actualizar en la cabecera; en el móvil, debajo del título */
.head-acciones { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
@media (max-width: 560px) { .head-row:has(.head-acciones) { grid-template-columns: minmax(0, 1fr); } .head-acciones { justify-content: flex-start; } }
/* hoja de exportar: qué lista y en qué formato */
.exp-que { display: grid; gap: 10px; min-width: 0; margin: 0; padding: 0; border: 0; }
.exp-ops { display: flex; flex-wrap: wrap; gap: 8px; }
.exp-op { position: relative; display: inline-flex; align-items: center; min-height: 42px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--pill); background: var(--surface-2); font-size: var(--fs-sm); font-weight: 700; cursor: pointer; }
.exp-op input { position: absolute; opacity: 0; pointer-events: none; }
.exp-op:has(input:checked) { border-color: rgba(255, 238, 180, .55); background: var(--fondo-oro); color: #14110A; }
.exp-op:has(input:checked) .count { color: #14110A; }
.exp-op:has(input:focus-visible) { outline: 2px solid var(--gold); outline-offset: 2px; }
.exp-formatos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.exp-btn { display: grid; justify-items: start; align-content: start; gap: 12px; min-width: 0; padding: 16px; border: 1px solid rgba(227, 194, 90, .3); border-radius: var(--r-lg); background: var(--fondo-negro); color: var(--ink); font: inherit; text-align: left; cursor: pointer; transition: border-color .15s, transform .1s; }
.exp-btn:hover { border-color: var(--gold); }
.exp-btn:active { transform: scale(.98); }
.exp-btn:disabled { cursor: progress; opacity: .6; }
.exp-btn.cargando { opacity: 1; border-color: var(--gold); }
.exp-btn.cargando .exp-ico { animation: latido 1.2s ease-out infinite; }
.exp-ico { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--fondo-oro); color: #14110A; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45); }
.exp-ico svg { width: 22px; height: 22px; }
.exp-txt { display: grid; gap: 2px; }
.exp-txt b { font-family: var(--display); font-size: 1.1875rem; font-weight: 700; }
.mail-ok { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: var(--r-md); background: var(--gold-soft); color: var(--ink); font-size: var(--fs-sm); text-align: left; }

.group-h { padding: 22px 4px 10px; color: var(--muted); font-size: var(--fs-xs); font-weight: 700; }

.row {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr);
  gap: 12px;
  padding: 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);

.group-h + .row { border-top-left-radius: var(--r-lg); border-top-right-radius: var(--r-lg); }

.row-main { display: grid; gap: 4px; min-width: 0; }

}

.sum-total { color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }

.chip {
  display: inline-block;
  padding: 4px 12px;
  border-radius: var(--pill);
  background: var(--surface-2);
  font-size: var(--fs-sm);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.chip b { color: var(--gold); }
.orders { display: grid; gap: 12px; }
.order { display: grid; gap: 8px; padding: 18px; border-radius: var(--r-lg); background: var(--surface); }
.order-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }

.results { display: grid; gap: 8px; }
.results li { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }

/* ---------- carga y avisos ---------- */
.sk-list { display: grid; gap: 1px; border-radius: var(--r-lg); overflow: hidden; }
.sk-row { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; align-items: center; padding: 16px; background: var(--surface); }

.sk-num { width: 40px; height: 28px; border-radius: 8px; }
.sk-line { height: 44px; max-width: 240px; }
@keyframes late { to { opacity: .45; } }
.toasts {
  position: fixed;
  z-index: 80;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  transform: translateX(-50%);
  width: min(440px, calc(100% - 32px));
  display: grid;
  gap: 8px;
  pointer-events: none;
}
.toast {
  padding: 12px 18px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-3);
  color: var(--ink);

  font-size: var(--fs-sm);

@keyframes aparece { from { transform: translateY(-8px); } to { transform: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* confirmación: botón para mandar la reserva o el pedido al WhatsApp del club */
.wa-nota { color: var(--muted); font-size: var(--fs-sm); text-align: center; }
.btn-wa svg { width: 20px; height: 20px; }

/* contacto (inicio): email y los dos WhatsApp, con botón de llamar */
.con-lista { display: grid; gap: 8px; }
.con-lista li { display: flex; gap: 8px; }
.con-item { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid rgba(227, 194, 90, .22); border-radius: var(--r-md); background: rgba(255, 255, 255, .03); color: inherit; text-decoration: none; transition: border-color .15s; }
.con-item:hover, .con-tel:hover { border-color: var(--gold); }
.con-ico { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--fondo-oro); color: #14110A; }
.con-ico svg { width: 19px; height: 19px; }
.con-txt { display: grid; min-width: 0; }
.con-txt small { color: var(--muted); font-size: .75rem; font-weight: 700; }
.con-txt b { overflow: hidden; font-size: .9375rem; text-overflow: ellipsis; white-space: nowrap; }
.con-tel { flex: none; display: grid; place-items: center; width: 52px; border: 1px solid rgba(227, 194, 90, .22); border-radius: var(--r-md); color: var(--gold); }

/* ---------- ordenadores y tablets grandes: la app aprovecha el ancho ---------- */
@media (min-width: 900px) {
  .main-in, body.en-inicio .main-in { max-width: 1240px; margin-inline: auto; }
  .home > :not(.carousel) { max-width: none; }
  /* los dos botones principales, uno al lado del otro */
  .home-ctas { grid-template-columns: repeat(auto-fit, minmax(380px, 400px)); justify-content: center; gap: 12px 16px; }
  .home-block.con-foto { min-height: 300px; }
  .con-foto .block-txt { padding: 32px 40px; }
  /* historia: portada con la foto a la derecha y textos a dos columnas */
  .his-portada { grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); align-items: center; min-height: 340px; }
  .his-portada img { order: 2; height: 100%; aspect-ratio: auto; -webkit-mask-image: linear-gradient(90deg, transparent, #000 35%); mask-image: linear-gradient(90deg, transparent, #000 35%); }
  .his-portada-txt { margin-top: 0; padding: 36px 40px; }
  .his-portada.sin-foto { grid-template-columns: minmax(0, 1fr); }
  .his-frase { font-size: 2rem; }
  .his-textos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 40px; }
  .his-cifras { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .his-cierre { padding: 36px 40px; }
}
@media (min-width: 1200px) {
  /* inicio: Inscripciones, Dónde estamos y Contacto en una fila */
  .home-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .home-grid > :last-child:nth-child(odd) { grid-column: auto; }
  .home-grid > :only-child { grid-column: 1 / -1; }
  /* ropa: cuatro prendas por fila */
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
  /* horarios: tres días por fila */
  .dias { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (min-width: 1600px) {
  .main-in, body.en-inicio .main-in { max-width: 1400px; }
}
@media (min-width: 900px) { .home-ctas.his-ctas { grid-template-columns: minmax(0, 420px); } }

/* reservas: las semanas se colocan en 1, 2 o 3 columnas según el ancho que haya (móvil, tablet, ordenador) */
.slots-wrap { container-type: inline-size; }
@container (min-width: 700px) {
  .slots-area { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 24px 20px; }
  .slots-area > :not(.week) { grid-column: 1 / -1; }
}
@container (min-width: 1080px) { .slots-area { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

}

/* ---------- inscripciones: ficha de primera visita ---------- */
.ficha { max-width: 760px; }
@media (min-width: 900px) { .ficha { margin-inline: auto; width: 100%; } }
.ficha-intro {
  position: relative;
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr);
  gap: 4px 12px;
  padding: 16px;
  overflow: hidden;
  border: 1px solid rgba(255, 238, 180, .55);
  border-radius: var(--r-lg);
  background: var(--fondo-oro);
  color: #14110A;
  box-shadow: 0 18px 44px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .4);
}
.ficha-intro-ico { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: #14110A; color: var(--gold); }

.ficha-pasos b { flex: none; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: #14110A; color: var(--gold); font-size: .6875rem; }
.ficha-form { gap: 16px; }
.ficha-sec {
  display: grid;
  gap: 18px;
  padding: 20px;
  border: 1px solid rgba(227, 194, 90, .24);
  border-radius: var(--r-lg);
  background: var(--fondo-negro);
}
.ficha-sec-t { display: flex; align-items: center; gap: 12px; color: var(--gold); font-family: var(--display); font-size: 1.125rem; font-weight: 700; line-height: 1.25; }
.ficha-n { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--fondo-oro); color: #14110A; font-size: .9375rem; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45); }
.ficha-2 { display: grid; gap: 18px; }
@media (min-width: 560px) { .ficha-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }
.ficha input[type="date"].input { min-width: 0; color-scheme: dark; }
.edad-chip { justify-self: start; padding: 4px 12px; border-radius: var(--pill); background: var(--gold-soft); color: var(--gold); font-size: var(--fs-xs); font-weight: 800; }
.ficha-q { display: grid; gap: 10px; min-width: 0; margin: 0; padding: 0; border: 0; }
.ficha-leg { font-weight: 500; color: var(--muted); line-height: 1.5; }
.ficha-leg b { color: var(--ink); }
/* respuestas en forma de píldora: la elegida, en oro */
.pildoras { display: flex; flex-wrap: wrap; gap: 8px; }
.pildora { position: relative; cursor: pointer; }
.pildora input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.pildora span { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1.5px solid var(--line); border-radius: var(--pill); background: var(--surface-2); font-weight: 700; font-size: var(--fs-sm); transition: border-color .15s, background-color .15s, color .15s; }
.pildora:hover span { border-color: rgba(227, 194, 90, .6); }
.pildora input:checked + span { border-color: rgba(255, 238, 180, .7); background: var(--fondo-oro); color: #14110A; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4); }
.pildora input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
.ficha-q[aria-invalid="true"] .pildora span, .pildoras:has(input[aria-invalid="true"]) .pildora span { border-color: var(--bad); }

.revela { display: none; }
.ficha-q:has(input[value="Sí"]:checked) .revela { display: grid; animation: aparece .2s ease; }
.ficha-emerg { display: grid; gap: 12px; padding: 16px; border: 1px dashed rgba(227, 194, 90, .35); border-radius: var(--r-md); }
.ficha-emerg .label { display: flex; align-items: center; gap: 8px; color: var(--gold); }
.ficha-emerg .label svg { width: 18px; height: 18px; }
.ficha .check { color: rgba(244, 241, 234, .82); line-height: 1.5; }

.ficha-fecha { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 16px; border: 1px solid var(--line); border-radius: var(--r-md); color: var(--muted); font-weight: 600; }
.ficha-fecha svg { width: 18px; height: 18px; color: var(--gold); }
/* recuadro de la firma: papel claro, con una línea de base como en la ficha impresa */
.firma-caja { position: relative; border: 1.5px dashed rgba(227, 194, 90, .55); border-radius: var(--r-md); background: #F7F4EC; overflow: hidden; touch-action: none; }
.firma-caja::after { content: ""; position: absolute; left: 22px; right: 22px; bottom: 40px; border-bottom: 1px solid rgba(20, 17, 10, .25); pointer-events: none; }
.firma-caja[aria-invalid="true"] { border-color: var(--bad); }
.firma-lienzo { display: block; width: 100%; height: 170px; cursor: crosshair; touch-action: none; }
.firma-guia { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; align-items: center; gap: 8px; color: rgba(20, 17, 10, .45); font-size: var(--fs-xs); font-weight: 600; pointer-events: none; }
.firma-guia svg { width: 18px; height: 18px; }
.firma-caja.firmada .firma-guia { display: none; }
.firma-borrar { position: absolute; top: 8px; right: 8px; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border: 1px solid rgba(20, 17, 10, .25); border-radius: var(--pill); background: #FFFFFF; color: #14110A; font: inherit; font-size: var(--fs-xs); font-weight: 700; cursor: pointer; }

.ficha-enviar { min-width: 0; width: 100%; }
.ficha-done { justify-items: center; padding: 28px 20px; border: 1px solid rgba(227, 194, 90, .3); border-radius: var(--r-lg); background: var(--fondo-negro); text-align: center; }
.ficha-done .btn { width: 100%; max-width: 420px; }

  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* sin almacenamiento */ } },
};

  del(k) { try { sessionStorage.removeItem(k); } catch (e) { /* sin almacenamiento */ } },
};

/* ---------- fechas ---------- */
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const pad = n => String(n).padStart(2, '0');
const pad4 = n => String(n).padStart(4, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return { y, m, d }; };
const diaSemana = s => { const { y, m, d } = parseYmd(s); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fechaLarga = s => { const { m, d } = parseYmd(s); return `${DIAS[diaSemana(s)]} ${d} de ${MESES[m - 1]}`; };
const fechaConAnio = s => { const { y, m, d } = parseYmd(s); return `${d} de ${MESES[m - 1]} de ${y}`; };
const sumaDias = (s, n) => { const { y, m, d } = parseYmd(s); const t = new Date(Date.UTC(y, m - 1, d + n)); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`; };
const diasEntre = (a, b) => { const A = parseYmd(a), B = parseYmd(b); return Math.round((Date.UTC(B.y, B.m - 1, B.d) - Date.UTC(A.y, A.m - 1, A.d)) / 864e5); };
const sumaMin = (hora, min) => { const [h, m] = hora.split(':').map(Number); const t = h * 60 + m + min; return `${pad(Math.floor(t / 60) % 24)}:${pad(t % 60)}`; };
const claveAhora = (offsetMin = 0) => { const d = new Date(Date.now() + offsetMin * 60000); return `${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const mesLabel = (ym, conAnio) => { const [y, m] = ym.split('-').map(Number); const n = cap(MESES[m - 1]); return conAnio ? `${n} ${y}` : n; };
const euros = n => new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2 }).format(n);
const tallaTxt = t => /^[uú]nica$/i.test(String(t)) ? 'talla única' : `talla ${t}`;
const soloDigitos = t => String(t || '').replace(/[^\d]/g, '');
const telWa = t => { let d = soloDigitos(t); if (d.startsWith('00')) d = d.slice(2); if (d.length === 9 && /^[6789]/.test(d)) d = '34' + d; return d; };
const waUrl = (tel, texto) => `https://wa.me/${telWa(tel)}${texto ? `?text=${encodeURIComponent(texto)}` : ''}`;
const TALLAS_ORDEN = ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL'];
const ordenTalla = t => { const m = String(t).match(/^(\d+)/); if (m) return Number(m[1]) / 1000; const i = TALLAS_ORDEN.indexOf(String(t).toUpperCase()); return i >= 0 ? 100 + i : 200; };

/* Horarios aleatorios reproducibles: el mismo día siempre da las mismas 3 horas
   (misma fórmula que en Code.gs, para que demo y hoja coincidan). */
function semilla(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function horasAleatorias(fecha, pool, n, sal) {
  const rnd = mulberry32(semilla(sal + '|' + fecha));
  const a = pool.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a.slice(0, n).sort();
}

/* Texto de los avisos (igual que en Code.gs) */
function textoReserva(r) {
  const L = [`*Nueva reserva de clase* (${r.id})`, `${cap(fechaLarga(r.fecha))}, ${r.hora}`, `Deportista: ${r.nombre}`, `Teléfono: ${r.telefono}`];
  if (r.email) L.push(`Email: ${r.email}`);
  if (r.tipo) L.push(`Tipo: ${tipoTxt(r.tipo)}`);
  if (r.comentario) L.push(`Comentario: ${r.comentario}`);
  return L.join('\n');
}
function textoPedido(p) {
  const L = [`*Nuevo pedido de ropa* (${p.id})`, `Deportista: ${p.nombre}`, `Teléfono: ${p.telefono}`];
  p.lineas.forEach(l => L.push(`• ${l.nombre}, ${tallaTxt(l.talla)} ×${l.cantidad}: ${euros(l.precio * l.cantidad)}`));
  L.push(`Total: ${euros(p.total)}`);
  if (p.observaciones) L.push(`Observaciones: ${p.observaciones}`);
  return L.join('\n');
}
